<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MICROCAP Radar</title>
<style>
:root{color-scheme:dark;--bg:#07101f;--card:#101b2d;--line:#24324a;--muted:#93a4bd;--green:#42d392;--yellow:#ffd166;--red:#ff6b6b;--blue:#75a7ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#050b16,#0a1324);color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:860px;margin:auto;padding:20px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;font-size:21px}.badge{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:6px 9px;border-radius:999px}
.search{display:flex;gap:8px;margin:18px 0}.search input{flex:1;background:#0c1728;border:1px solid var(--line);color:white;border-radius:12px;padding:13px;font-size:16px;text-transform:uppercase}.search button,.tabs button{background:#15243b;color:white;border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-weight:700}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.tabs button.active{border-color:var(--blue);background:#1a3155}
.hero,.card{background:rgba(16,27,45,.92);border:1px solid var(--line);border-radius:17px;padding:16px;margin:11px 0}.ticker{font-size:29px;font-weight:900}.muted{color:var(--muted);font-size:13px}.score{font-size:25px;font-weight:900;color:var(--yellow)}h2{font-size:17px;margin:0 0 12px}.conclusion{line-height:1.55;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{background:#0b1525;border-radius:12px;padding:11px}.label{font-size:12px;color:var(--muted);margin-bottom:5px}.value{font-size:14px;font-weight:700;line-height:1.35}.short .value{color:#e9f1ff}.note{font-size:12px;color:var(--yellow);line-height:1.45;margin-top:11px;padding:10px;background:#171a21;border-radius:10px}.list{padding-left:19px;margin:0}.list li{margin:7px 0;line-height:1.45}.memo{white-space:pre-wrap;background:#08111e;border-radius:12px;padding:13px;font-size:13px;line-height:1.55}.copy{width:100%;margin-top:9px;border:0;border-radius:10px;padding:11px;background:#274c77;color:#fff;font-weight:800}.empty{text-align:center;padding:45px 12px;color:var(--muted)}
@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding-top:15px}.brand{font-size:19px}}
</style></head><body><main class="wrap">
<div class="top"><div class="brand">📡 MICROCAP Radar</div><div class="badge">투자판단 보조용</div></div>
<div class="search"><input id="q" placeholder="티커 검색 · WSHP, CYAB, YMAT"><button onclick="go()">검색</button></div>
<div class="tabs" id="tabs"></div><div id="app"></div>
</main><script>
const DATA={"WSHP": {"company": "WeShop Holdings Limited", "exchange": "Nasdaq Capital Market", "score": 58, "price": "$4.83 (10/09 종가 참고값)", "conclusion": "핵심은 공급 구조. Roth $25M 시설 + 최대 6.0M주 재판매 등록이 오버행이 될 수 있다. EFFECT/실제 발행 전후를 분리해서 봐야 한다.", "structure": [["O/S", "11.717M (9/24 기준)"], ["Float 대용치", "Non-affiliate 3.981M"], ["주요 공급", "Roth 최대 $25M Committed Equity Facility"], ["Resale", "최대 6.0M주 등록 추진"]], "short": [["최신 Short Interest", "209,559주 · 2026-09-15"], ["직전 Short Interest", "273,803주 · 2026-08-31"], ["증감", "-23.46%"], ["Short Float", "약 9.79%–15.81% · Float/제공처 기준 차이"], ["DTC", "약 0.56–3.27 · 제공처 기준 차이"], ["CTB", "데이터 필요"], ["대차 가능", "데이터 필요"]], "events": ["11/16 미국 앱 공식 출시", "F-1/EFFECT 및 실제 발행 여부 확인"], "risk": ["6.0M resale 물량은 O/S 대비 약 51%", "자금조달 실행 시 공급 증가", "Float 정의에 따라 공매 비율 차이 큼"], "memo": "[WSHP] 구조점수 58/100\n- O/S 11.717M / non-affiliate 3.981M\n- Roth $25M 시설 + 최대 6M resale\n- SI 209,559주(9/15), 직전 대비 -23.46%\n- Short Float 약 9.79~15.81% (Float 기준 차이)\n- 11/16 미국 앱 출시\n- 핵심: EFFECT/실제 발행과 공급 전환 확인"}, "CYAB": {"company": "Cyabra, Inc.", "exchange": "Nasdaq Global Market", "score": 68, "price": "가격 데이터 연결 필요", "conclusion": "재료와 공매도 연료는 강하지만 공급이 깨끗한 종목은 아니다. 공매 잔고가 급증했고 계약 명분도 있으나 대규모 저가 워런트와 신규 resale S-1이 핵심 리스크다.", "structure": [["O/S", "34.785M (10/7 기준)"], ["Float", "공식 확인 필요"], ["신규 Resale S-1", "최대 21.466M주"], ["워런트", "PFW $0.0001 / B $0.45 / A $0.50 대량 존재"]], "short": [["최신 Short Interest", "1,550,919주 · 2026-09-30"], ["직전 Short Interest", "60,649주 · 2026-09-15"], ["증감", "+2,457.2%"], ["Short Float", "제3자 기준 약 52.2% / 실제 Float 확인 필요"], ["DTC", "약 1.0"], ["10/9 Daily Short Volume", "약 212K / 약 567K = 37.4% · SI와 다른 지표"], ["CTB", "데이터 필요"], ["대차 가능", "데이터 필요"]], "events": ["10/8 신규 S-1 EFFECT 여부 확인", "Nasdaq MVLS 11/9 데드라인", "$1 minimum bid 12/7 데드라인", "RS 1:2~1:30 제안 상태"], "risk": ["21.466M주 resale 등록", "대규모 저가 워런트", "Going-concern/자금조달 압력", "실제 Float 미확정"], "memo": "[CYAB] 구조점수 68/100\n- O/S 34.785M / 실제 Float 확인 필요\n- SI 1,550,919주(9/30), +2,457.2%\n- 제3자 Short Float 약 52.2%, 공식 Float 확인 필수\n- 신규 S-1 resale 21.466M주\n- PFW $0.0001 / B $0.45 / A $0.50\n- 핵심: S-1 EFFECT + 실제 Float/CTB + RS 일정"}, "YMAT": {"company": "J-Star Holding Co., Ltd.", "exchange": "Nasdaq Capital Market", "score": 57, "price": "$1.29 (10/09 정규장) / 장후 약 $3.03 참고", "conclusion": "초저유통 가능성 + 드론/미국 생산 재료 + 폭발적 거래량이 붙었지만, $150M EFFECT shelf와 $35M Hudson Equity Line이 살아 있다. 재료가 강한 동시에 급등 후 조달하기 좋은 구조다.", "structure": [["O/S", "공식 최신치 확인 필요 · 제공처 불일치"], ["Float", "제3자 약 0.66M–1.64M / 공식 확인 필요"], ["F-3 Shelf", "$150M · 9/23 EFFECT"], ["Equity Line", "Hudson 최대 $35M · 36개월"], ["RS", "1:5 · 7/10 실행"]], "short": [["최신 Short Interest", "65,449주 · 2026-09-15"], ["직전 Short Interest", "19,393주 · 2026-08-31"], ["증감", "+237.49%"], ["Short Float", "약 4.0%–9.74% · Float 기준 차이"], ["DTC", "약 0.04–1.00 · 제공처 기준 차이"], ["CTB", "데이터 필요"], ["대차 가능", "데이터 필요"]], "events": ["10/29 주주 미팅", "Hudson resale 등록/실제 Put·발행 확인", "F-3 prospectus supplement 확인"], "risk": ["$150M F-3 EFFECT", "$35M Equity Line", "Authorized Class A 60M", "2025말 취약한 재무/going concern", "드론 공장은 계획 단계", "장후 급등 추격 변동성"], "memo": "[YMAT] 구조점수 57/100\n- 10/9 $1.29 → 장후 약 $3.03\n- Float 제3자 0.66M~1.64M, 공식 확인 필요\n- SI 65,449주(9/15), +237.49%\n- Short Float 약 4.0~9.74%\n- 9/23 $150M F-3 EFFECT\n- 9/24 Hudson $35M Equity Line\n- 핵심: 실제 Float / Hudson 발행 / F-3 supplement / 10/29"}};
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function items(a, cls=''){return `<div class="grid ${cls}">${a.map(x=>`<div class="item"><div class="label">${esc(x[0])}</div><div class="value">${esc(x[1])}</div></div>`).join('')}</div>`}
function render(t){
 t=(t||'WSHP').toUpperCase(); const d=DATA[t];
 history.replaceState(null,'','?ticker='+encodeURIComponent(t));
 [...document.querySelectorAll('.tabs button')].forEach(b=>b.classList.toggle('active',b.dataset.t===t));
 if(!d){$('#app').innerHTML=`<div class="card empty"><b>${esc(t)}</b><br><br>아직 분석되지 않은 종목입니다.</div>`;return}
 $('#app').innerHTML=`
 <section class="hero"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="ticker">${t}</div><div class="muted">${esc(d.company)} · ${esc(d.exchange)}</div><div class="muted" style="margin-top:5px">${esc(d.price)}</div></div><div><div class="muted">구조점수</div><div class="score">${d.score}/100</div></div></div></section>
 <section class="card"><h2>⚡ 10초 결론</h2><div class="conclusion">${esc(d.conclusion)}</div></section>
 <section class="card"><h2>📊 회사 / 주식 구조</h2>${items(d.structure)}</section>
 <section class="card"><h2>🩳 공매도 / 수급</h2>${items(d.short,'short')}<div class="note">FINRA Short Interest(쇼트 인터레스트, 공매도 잔고)는 실시간이 아니라 월 2회 결제일 기준 발표 데이터입니다. Daily Short Volume(데일리 쇼트 볼륨, 일일 공매도 거래량)과는 다른 지표입니다.</div></section>
 <section class="card"><h2>📅 체크 이벤트</h2><ul class="list">${d.events.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>
 <section class="card"><h2>⚠️ 핵심 리스크</h2><ul class="list">${d.risk.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>
 <section class="card"><h2>📝 토스 메모용 요약</h2><div class="memo" id="memo">${esc(d.memo)}</div><button class="copy" onclick="navigator.clipboard.writeText(DATA['${t}'].memo);this.textContent='복사 완료'">복사</button></section>`;
}
function go(){render($('#q').value.trim())}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
$('#tabs').innerHTML=Object.keys(DATA).map(t=>`<button data-t="${t}" onclick="render('${t}')">${t}</button>`).join('');
render(new URLSearchParams(location.search).get('ticker')||'WSHP');
</script></body></html>
