name: Time Machine STEP9-R6F-R2C-REPAIR Certification Provenance Repair
on:
  push:
    branches: [main]
    paths:
      - 'timemachine/triggers/step9-r6f-r2c-repair.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  step9-r6f-r2c-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile preflight
        run: python -m py_compile timemachine/src/step9_r6f_r2c_repair.py
      - name: Download and verify frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/frozen
          gh api repos/${{ github.repository }}/actions/artifacts/12599331135/zip > /tmp/frozen/r2c-cert.zip
          gh api repos/${{ github.repository }}/actions/artifacts/12599375972/zip > /tmp/frozen/r2c-checkpoint.zip
          gh api repos/${{ github.repository }}/actions/artifacts/12598532465/zip > /tmp/frozen/r2b-checkpoint.zip
          echo 'f5388c1fe5d73f510c7d134151cfdad0d7930637fadbb5c77c7bb810b8c0d98d  /tmp/frozen/r2c-cert.zip' | sha256sum -c -
          echo '9dd093390c1e1d77d296821ba24bdd48bf2b5db1084ce8e7748fcefb4e2ba781  /tmp/frozen/r2c-checkpoint.zip' | sha256sum -c -
          echo '304417863af9786f75806349c1c108c0d0d69619a15352e3233787e0323de8cd  /tmp/frozen/r2b-checkpoint.zip' | sha256sum -c -
      - name: Legacy 638 certification and alternative provider acquisition
        run: |
          rm -rf /tmp/r2c-repair && mkdir -p /tmp/r2c-repair
          echo '{}' > /tmp/r2c-repair/manifest.json
          python timemachine/src/step9_r6f_r2c_repair.py --r2c-cert /tmp/frozen/r2c-cert.zip --r2c-checkpoint /tmp/frozen/r2c-checkpoint.zip --r2b-checkpoint /tmp/frozen/r2b-checkpoint.zip --out /tmp/r2c-repair --head-sha '${{ github.sha }}'
      - name: Strict certification validation
        run: |
          python - <<'PY'
          import json,hashlib,os
          o='/tmp/r2c-repair';m=json.load(open(o+'/manifest.json'));assert m['missing']==[]
          h=json.load(open(o+'/hashes.json'))
          for p,x in h.items(): assert hashlib.sha256(open(os.path.join(o,p),'rb').read()).hexdigest()==x,p
          l=json.load(open(o+'/legacy_638_certification_audit.json'));assert l['raw_evidence_packaged']==638 and l['valid_SHA_chain']==638 and l['valid_PIT']==638 and l['independently_reproducible']==638 and l['invalidated']==0
          s=json.load(open(o+'/secret_redaction_audit.json'));assert s['files_scanned']>0 and s['confirmed_secrets']==0
          d=json.load(open(o+'/determinism_audit.json'));assert d['disagreements']==0
          n=json.load(open(o+'/nonmutation_audit.json'));assert all(v==0 for v in n.values())
          t=json.load(open(o+'/technical_verdict.json'));assert t['STEP9']=='BLOCKED' and t['STEP10_GATE']=='BLOCKED' and t['R6F_R3']=='NOT_ALLOWED'
          print(t)
          PY
      - name: Verify protected diff
        run: |
          git fetch --no-tags --depth=1 origin 54f0b0fd743c225a349ec8a886ab1b4ea3461b8f
          python - <<'PY'
          import subprocess
          base='54f0b0fd743c225a349ec8a886ab1b4ea3461b8f'
          files=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines();print(files)
          forbidden=[f for f in files if f.startswith('v2/') or f.startswith('timemachine/src/prediction') or 'snapshot' in f.lower() or 'context' in f.lower() or 'rule_engine' in f.lower()];assert not forbidden,forbidden
          allowed={'.github/workflows/timemachine-step9-r6f-r2c-repair.yml','timemachine/src/step9_r6f_r2c_repair.py','timemachine/triggers/step9-r6f-r2c-repair.txt'};assert set(files)<=allowed,(set(files)-allowed)
          PY
      - name: Upload R2C repair checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: timemachine-step9-r6f-r2c-repair-checkpoint
          path: /tmp/r2c-repair/checkpoint.json
          if-no-files-found: error
      - name: Upload R2C repair certification
        uses: actions/upload-artifact@v4
        with:
          name: timemachine-step9-r6f-r2c-repair-certification
          path: /tmp/r2c-repair/
          if-no-files-found: error
