name: Time Machine STEP9 Deterministic Predictions
on:
  workflow_dispatch:
  push:
    paths:
      - timemachine/step9-trigger.txt
permissions:
  contents: read
  actions: read
jobs:
  step9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen STEP8 certification and Context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/12584852321/zip > /tmp/step8-cert.zip
          gh api repos/${{ github.repository }}/actions/artifacts/12583614872/zip > /tmp/step8-context.zip
      - name: Verify frozen inputs
        run: |
          echo '2ec1f79a97ba4037da91e31a8b71bf1ae53bad14de4c803432dc1c9673dc500b  /tmp/step8-cert.zip' | sha256sum -c -
          echo '4a4b15c85c50f7034a692e92b77f8665af77ee40c22e2997b06981b8cd52dc51  /tmp/step8-context.zip' | sha256sum -c -
      - name: Run STEP9 outcome-blind deterministic replay
        run: |
          python timemachine/src/step9_deterministic_prediction_snapshots.py \
            --cert /tmp/step8-cert.zip \
            --context /tmp/step8-context.zip \
            --out /tmp/step9-out \
            --commit '${{ github.sha }}'
      - name: Protect production and future steps
        run: |
          test -z "$(git diff HEAD~3 HEAD -- v2/)"
          test -z "$(git diff HEAD~3 HEAD -- timemachine/src/step10* timemachine/src/step11* .github/workflows/timemachine-step10* .github/workflows/timemachine-step11*)"
      - name: Require technical STEP9 PASS before upload
        run: |
          python - <<'PY'
          import json
          v=json.load(open('/tmp/step9-out/step9-verdict.json'))
          assert v['verdict']=='STEP9_PASS', v
          assert v['outcome_evaluated'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: timemachine-step9-deterministic-prediction-snapshots
          path: /tmp/step9-out/
          retention-days: 90
