name: Time Machine STEP9 Coverage Limit Governance Review
on:
  push:
    branches: [main]
    paths:
      - 'timemachine/triggers/step9-coverage-limit-governance-review.txt'
      - '.github/workflows/timemachine-step9-coverage-limit-governance-review.yml'
      - 'timemachine/src/step9_coverage_limit_governance_review.py'
permissions: {contents: read, actions: read}
jobs:
  coverage-limit-governance-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Compile
        run: python -m py_compile timemachine/src/step9_coverage_limit_governance_review.py
      - name: Download and verify frozen originals
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p /tmp/frozen
          gh api repos/${{ github.repository }}/actions/artifacts/12601937820/zip > /tmp/frozen/v52-cert.zip
          gh api repos/${{ github.repository }}/actions/artifacts/12601043953/zip > /tmp/frozen/v52-checkpoint.zip
          gh api repos/${{ github.repository }}/actions/artifacts/12601229639/zip > /tmp/frozen/design-cert.zip
          gh api repos/${{ github.repository }}/actions/artifacts/12601539319/zip > /tmp/frozen/design-checkpoint.zip
          echo 'c3d33505bda316031e2944aed1cf5a2203f01849b65753baad902ed8f19eb165  /tmp/frozen/v52-cert.zip' | sha256sum -c -
          echo '42a2b4905b05cd3bcae9d0de8662d37b80d6ba604d785ad789d6b23120a01357  /tmp/frozen/v52-checkpoint.zip' | sha256sum -c -
          echo 'dad090de7b74209857bc6f7fde65e438e55d9f69c7bf38113cda2bc97864f677  /tmp/frozen/design-cert.zip' | sha256sum -c -
          echo 'd7666e80febeafff6f509725cdf7fdc5450fcda24222886bc25c5308d941c184  /tmp/frozen/design-checkpoint.zip' | sha256sum -c -
      - name: Run governance review
        run: |
          rm -rf /tmp/governance; mkdir -p /tmp/governance
          python timemachine/src/step9_coverage_limit_governance_review.py --v52-cert /tmp/frozen/v52-cert.zip --v52-checkpoint /tmp/frozen/v52-checkpoint.zip --design-cert /tmp/frozen/design-cert.zip --design-checkpoint /tmp/frozen/design-checkpoint.zip --out /tmp/governance --head-sha '${{ github.sha }}' --base-sha '27d5572c90a8e3007ecb3e4b1a8c22e54097be6d'
      - name: Strict validate governance review
        run: |
          python - <<'PY'
          import json,hashlib,os
          o='/tmp/governance'
          g=json.load(open(o+'/governance_decision.json')); assert g['governance_decision'] in {'COVERAGE_LIMIT_GOVERNANCE_GO','COVERAGE_LIMIT_GOVERNANCE_CONDITIONAL_GO','COVERAGE_LIMIT_GOVERNANCE_NO_GO'}
          p=json.load(open(o+'/population_governance_classification.json')); assert p['total']==5026 and sum(p['counts'].values())==5026 and p['counts']['CERTIFIED_IDENTITY']==638
          r=json.load(open(o+'/residual_fail_closed_contract.json')); assert r['tested']==4388 and not r['fallback_allowed'] and not r['identity_dependent_downstream_allowed']
          l=json.load(open(o+'/legacy_638_preservation.json')); assert l['tested']==638 and l['invalidated']==0 and l['existing_pred_id_changed']==0
          m=json.load(open(o+'/multi_ticker_preservation.json')); assert m['audited']==19 and m['false_merges']==0 and m['synthetic_included']==0 and m['synthetic_excluded']==4
          n=json.load(open(o+'/nonmutation.json')); assert n['PASS'] and sum(v for k,v in n.items() if k!='PASS')==0
          s=json.load(open(o+'/secret_scan.json')); assert s['files_scanned']>0 and s['confirmed_secrets']==0 and s['credential_bearing_urls']==0 and s['authorization_headers_stored']==0
          man=json.load(open(o+'/manifest.json'))
          for p,h in man['files'].items(): assert hashlib.sha256(open(os.path.join(o,p),'rb').read()).hexdigest()==h,p
          print(json.dumps(g,indent=2))
          PY
      - name: Protected diff audit
        run: |
          python - <<'PY'
          import subprocess
          fs=subprocess.check_output(['git','diff','--name-only','27d5572c90a8e3007ecb3e4b1a8c22e54097be6d','HEAD'],text=True).splitlines(); print(fs)
          allowed={'.github/workflows/timemachine-step9-coverage-limit-governance-review.yml','timemachine/triggers/step9-coverage-limit-governance-review.txt','timemachine/src/step9_coverage_limit_governance_review.py'}
          assert set(fs)<=allowed,fs
          assert not any(f.startswith('v2/') or f.startswith('timemachine/src/prediction') or 'snapshot' in f.lower() or 'context' in f.lower() or 'rule_engine' in f.lower() for f in fs)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: step9-coverage-limit-governance-checkpoint, path: /tmp/governance/checkpoint.json, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: step9-coverage-limit-governance-certification, path: /tmp/governance/, if-no-files-found: error}
      - name: Independently download and verify original uploaded ZIPs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          sleep 2
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts > /tmp/artifacts.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/artifacts.json'))['artifacts']
          assert len(a)==2,a
          names={x['name'] for x in a}
          assert names=={'step9-coverage-limit-governance-certification','step9-coverage-limit-governance-checkpoint'},names
          PY
          CERT_ID=$(jq -r '.artifacts[]|select(.name=="step9-coverage-limit-governance-certification")|.id' /tmp/artifacts.json)
          CHK_ID=$(jq -r '.artifacts[]|select(.name=="step9-coverage-limit-governance-checkpoint")|.id' /tmp/artifacts.json)
          CERT_DIGEST=$(jq -r '.artifacts[]|select(.name=="step9-coverage-limit-governance-certification")|.digest' /tmp/artifacts.json | sed 's/^sha256://')
          CHK_DIGEST=$(jq -r '.artifacts[]|select(.name=="step9-coverage-limit-governance-checkpoint")|.digest' /tmp/artifacts.json | sed 's/^sha256://')
          gh api repos/${{ github.repository }}/actions/artifacts/$CERT_ID/zip > /tmp/original-cert.zip
          gh api repos/${{ github.repository }}/actions/artifacts/$CHK_ID/zip > /tmp/original-checkpoint.zip
          test "$(sha256sum /tmp/original-cert.zip | cut -d' ' -f1)" = "$CERT_DIGEST"
          test "$(sha256sum /tmp/original-checkpoint.zip | cut -d' ' -f1)" = "$CHK_DIGEST"
          rm -rf /tmp/ind-cert /tmp/ind-check; mkdir /tmp/ind-cert /tmp/ind-check
          unzip -q /tmp/original-cert.zip -d /tmp/ind-cert
          unzip -q /tmp/original-checkpoint.zip -d /tmp/ind-check
          python - <<'PY'
          import json,hashlib,os
          o='/tmp/ind-cert'
          man=json.load(open(o+'/manifest.json')); missing=0; mismatches=0
          for p,h in man['files'].items():
            q=os.path.join(o,p)
            if not os.path.exists(q): missing+=1; continue
            if hashlib.sha256(open(q,'rb').read()).hexdigest()!=h: mismatches+=1
          assert missing==0 and mismatches==0,(missing,mismatches)
          pop=json.load(open(o+'/population_governance_classification.json')); assert pop['total']==5026 and pop['counts']=={'CERTIFIED_IDENTITY':638,'SOURCE_ACQUISITION_INCOMPLETE':1429,'HISTORICAL_SOURCE_UNAVAILABLE':452,'NO_FROZEN_IDENTITY_EVIDENCE':2507}
          res=json.load(open(o+'/residual_fail_closed_contract.json')); assert res['tested']==4388 and not res['fallback_allowed'] and not res['identity_dependent_downstream_allowed']
          leg=json.load(open(o+'/legacy_638_preservation.json')); assert leg['tested']==638 and leg['invalidated']==0
          mt=json.load(open(o+'/multi_ticker_preservation.json')); assert mt['audited']==19 and mt['false_merges']==0 and mt['synthetic_excluded']==4
          det=json.load(open(o+'/determinism.json')); assert det['PASS'] and det['classification_disagreements']==0 and det['governance_disagreements']==0
          sec=json.load(open(o+'/secret_scan.json')); assert sec['confirmed_secrets']==0 and sec['credential_bearing_urls']==0 and sec['authorization_headers_stored']==0
          non=json.load(open(o+'/nonmutation.json')); assert non['PASS'] and sum(v for k,v in non.items() if k!='PASS')==0
          pd=json.load(open(o+'/protected_diff.json')); assert pd['PASS'] and pd['forbidden_mutations']==0 and pd['v2_mutations']==0
          gov=json.load(open(o+'/governance_decision.json')); assert gov['governance_decision']=='COVERAGE_LIMIT_GOVERNANCE_GO'
          print(json.dumps({'original_cert_digest_match':True,'original_checkpoint_digest_match':True,'manifest_missing':missing,'independent_hash_mismatches':mismatches,'independent_verdict':gov['runner_verdict']},indent=2))
          PY
