name: Collect Feb horizon prices (Jan cohort only)
on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Ticker/date config for completing January cohort outcome horizon'
        required: true
        default: 'data/feb-horizon-tickers.json'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Collect Feb 2-6 raw OHLCV + splits + dividends
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/collect_feb_horizon_prices.py "${{ inputs.config_file }}"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feb-horizon-prices
          path: feb-horizon-prices-artifact/
          if-no-files-found: error
