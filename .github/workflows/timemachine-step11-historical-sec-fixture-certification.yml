name: Time Machine STEP11 Historical SEC Fixture Certification
on:
  push:
    branches: [main]
    paths:
      - 'timemachine/triggers/step11-historical-sec-fixture-certification.txt'
      - '.github/workflows/timemachine-step11-historical-sec-fixture-certification.yml'
      - 'timemachine/src/step11_historical_sec_fixture_certification_v4.py'
      - 'timemachine/src/step11_frozen_authority_resolver_v2.py'
permissions: {contents: read, actions: read}
jobs:
  fixture-certification:
    runs-on: ubuntu-latest
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Compile
        run: |
          python -m py_compile timemachine/src/step11_historical_sec_fixture_certification_v4.py
          python -m py_compile timemachine/src/step11_frozen_authority_resolver_v2.py
      - name: Reacquire frozen authorities
        run: |
          mkdir -p /tmp/frozen /tmp/step9
          gh api /repos/${{ github.repository }}/actions/artifacts/12603520492/zip > /tmp/frozen/step9.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12603725128/zip > /tmp/frozen/step9-checkpoint.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12603356621/zip > /tmp/frozen/step10.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12603737037/zip > /tmp/frozen/step10-checkpoint.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12612704083/zip > /tmp/frozen/step11-plan.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12612965316/zip > /tmp/frozen/step11-plan-checkpoint.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12602635150/zip > /tmp/frozen/governance.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12602225859/zip > /tmp/frozen/governance-checkpoint.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12603066455/zip > /tmp/frozen/step9-plan.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12602074250/zip > /tmp/frozen/step9-plan-checkpoint.zip
          unzip -q /tmp/frozen/step9.zip -d /tmp/step9
      - name: Verify all frozen original archive digests
        run: |
          python - <<'PY'
          import hashlib,zipfile
          exp={'step9.zip':'3ec6a1f4ec88ff284eade8d7730b301ea65d2d5a932feb11a0f76c0592c7c19c','step9-checkpoint.zip':'a77f89137bfe5c299e46e39864e37826cc03ce84c3bbedee8c681bf538e31238','step10.zip':'b9a5a4d40bfc318288a15337fd74c47dcff93de619d6aa281ea9de6001ebf1de','step10-checkpoint.zip':'914587ecbbe5bcb579aff464b11c8fec0469f7400ee8eddc3d757f9ab30e181f','step11-plan.zip':'7f010552c35fb944121ea7fc44c46333b9584a5ae453443533955a7d231a7802','step11-plan-checkpoint.zip':'e9429bf127a38a8dbd1f0c6e13088eaefc9eddd005ddc1b41672975e52c5cf77','governance.zip':'5e256090278d2fdbfb76b190d965c64e7e3251ac2e67a061c55b8a76cd7549c4','governance-checkpoint.zip':'b6543ba219317b0beac67a683fea9ec4b6711a2677ed0c16467133ed2b94da64','step9-plan.zip':'d6c4e4703a8614907631345f6312933da06bd2c55e9f09a008759d606a51cd50','step9-plan-checkpoint.zip':'fbc1852d688859f41d543853ac45e798a8df89f378949bcb82f2f0caeaccf65e'}
          for n,want in exp.items():
           p='/tmp/frozen/'+n; got=hashlib.sha256(open(p,'rb').read()).hexdigest(); assert got==want,(n,got,want); assert zipfile.ZipFile(p).testzip() is None
          PY
      - name: Resolve frozen certification authorities V3
        run: python timemachine/src/step11_frozen_authority_resolver_v2.py --step9 /tmp/frozen/step9.zip --step10 /tmp/frozen/step10.zip --step11-plan /tmp/frozen/step11-plan.zip --out /tmp/frozen-authority-resolver-v3.json
      - name: Official SEC connectivity probe
        run: |
          python - <<'PY'
          import urllib.request,json,hashlib,datetime
          u='https://data.sec.gov/submissions/CIK0001631487.json'; req=urllib.request.Request(u,headers={'User-Agent':'MicrocapRadar historical-fixture-certification/4.0 contact: repository-owner','Accept-Encoding':'identity'})
          with urllib.request.urlopen(req,timeout=30) as r: b=r.read(); assert r.status==200 and b
          d={'endpoint_class':'SEC_SUBMISSIONS','request_timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'http_status':200,'response_bytes':len(b),'content_type':'application/json','response_sha256':hashlib.sha256(b).hexdigest(),'credential_required':False,'user_agent_valid':True,'infrastructure_capable':True}
          open('/tmp/sec-connectivity-probe.json','w').write(json.dumps(d,sort_keys=True,indent=2)+'\n')
          PY
      - name: Execute Fixture Pass A and acquire SEC once
        run: python timemachine/src/step11_historical_sec_fixture_certification_v4.py --out /tmp/fixture-a --head-sha '${{ github.sha }}' --step9-dir /tmp/step9
      - name: Execute Fixture Pass B from frozen Pass A evidence
        run: python timemachine/src/step11_historical_sec_fixture_certification_v4.py --out /tmp/fixture-b --head-sha '${{ github.sha }}' --step9-dir /tmp/step9 --reuse-from /tmp/fixture-a
      - name: Determinism and strict fixture validation
        run: |
          python - <<'PY'
          import json,pathlib,shutil,hashlib
          A=pathlib.Path('/tmp/fixture-a'); B=pathlib.Path('/tmp/fixture-b')
          names=['fixture_selection.json','historical_reconstruction.json','same_day_boundary_test.json','future_leakage_audit.json','accession_normalization.json','amendment_chain_audit.json','effect_sequence_audit.json','filing_vs_supply_audit.json','issuer_security_linkage_audit.json','query_coverage_audit.json','event_classification.json']
          for n in names: assert json.load(open(A/n))==json.load(open(B/n)),n
          da=json.load(open(A/'step11_fixture_decision.json')); db=json.load(open(B/'step11_fixture_decision.json')); assert da['decision']=='STEP11_HISTORICAL_SEC_BACKFILL_AND_EVENT_CLASSIFICATION_FIXTURE_CERTIFIED',da; assert db['decision']==da['decision']; assert db['pass_network_requests']==0,db
          assert json.load(open(A/'sec_acquisition_report.json'))['residual_sec_queries']==0; assert json.load(open(A/'sec_acquisition_report.json'))['unknown_sec_queries']==0
          assert json.load(open(A/'negative_regression_tests.json'))['count']>=48; assert json.load(open(A/'positive_regression_tests.json'))['count']>=20
          for src,dst in [('/tmp/frozen-authority-resolver-v3.json','frozen_authority_resolver_v3.json'),('/tmp/sec-connectivity-probe.json','sec_connectivity_probe.json')]: shutil.copy(src,A/dst)
          m=json.load(open(A/'manifest.json')); entries={e['path']:e for e in m['entries']}
          for n in ['frozen_authority_resolver_v3.json','sec_connectivity_probe.json']:
           p=A/n; entries[n]={'path':n,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          m['entries']=[entries[k] for k in sorted(entries)]; m['file_count']=len(m['entries']); (A/'manifest.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          PY
      - name: Protected diff lineage V4
        run: |
          python - <<'PY'
          import subprocess
          plan='129ef1e8689ac3b265ec183668823ba464463031'; pre='4ace0b4b4a34992dda2b7d656171238bfa8652a5'
          lineage=subprocess.check_output(['git','log','--format=%H','--ancestry-path',f'{plan}..HEAD'],text=True).splitlines(); assert pre in lineage
          pre_files=subprocess.check_output(['git','diff','--name-only',plan,pre],text=True).splitlines(); assert pre_files==['v2/data/review-daily-2026-10-23.json'],pre_files
          owned=subprocess.check_output(['git','diff','--name-only',pre,'HEAD'],text=True).splitlines(); allowed={'timemachine/src/step11_historical_sec_fixture_certification.py','timemachine/src/step11_historical_sec_fixture_certification_v4.py','timemachine/src/step11_frozen_authority_resolver_v2.py','.github/workflows/timemachine-step11-historical-sec-fixture-certification.yml','timemachine/triggers/step11-historical-sec-fixture-certification.txt'}; assert set(owned)<=allowed,owned; assert not any(x.startswith('v2/') for x in owned),owned
          print('PRE_EXISTING_UNRELATED_MAIN_CHANGE',pre_files); print('FIXTURE_OWNED_CHANGE',owned)
          PY
      - name: Security scan
        run: |
          python - <<'PY'
          import pathlib,re
          files=['timemachine/src/step11_historical_sec_fixture_certification_v4.py','timemachine/src/step11_frozen_authority_resolver_v2.py','.github/workflows/timemachine-step11-historical-sec-fixture-certification.yml']; text='\n'.join(pathlib.Path(x).read_text() for x in files); pats=[r'Bearer\s+[A-Za-z0-9._-]{10,}',r'[?&](?:apiKey|token|key)=[^&\s]+',r'Authorization:\s*[^$\n]']; assert not any(re.search(x,text,re.I) for x in pats)
          PY
      - name: Build checkpoint
        run: cp /tmp/fixture-a/checkpoint.json /tmp/step11-fixture-checkpoint.json
      - name: Upload Fixture Checkpoint
        uses: actions/upload-artifact@v4
        with: {name: step11-historical-sec-backfill-event-classification-fixture-certification-checkpoint, path: /tmp/step11-fixture-checkpoint.json}
      - name: Upload Fixture Certification
        uses: actions/upload-artifact@v4
        with: {name: step11-historical-sec-backfill-event-classification-fixture-certification, path: /tmp/fixture-a/}
      - name: Independently reacquire and verify uploaded artifacts
        run: |
          sleep 3
          python - <<'PY'
          import json,subprocess,zipfile,hashlib,os
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['GITHUB_RUN_ID']; data=json.loads(subprocess.check_output(['gh','api',f'/repos/{repo}/actions/runs/{run}/artifacts'],text=True))['artifacts']; assert len(data)==2,data
          names={a['name']:a for a in data}; expected={'step11-historical-sec-backfill-event-classification-fixture-certification','step11-historical-sec-backfill-event-classification-fixture-certification-checkpoint'}; assert set(names)==expected
          for name,a in names.items():
           p='/tmp/original-'+name+'.zip'; open(p,'wb').write(subprocess.check_output(['gh','api',f"/repos/{repo}/actions/artifacts/{a['id']}/zip"])); got=hashlib.sha256(open(p,'rb').read()).hexdigest(); assert a.get('digest') in (None,'sha256:'+got); assert zipfile.ZipFile(p).testzip() is None
          z=zipfile.ZipFile('/tmp/original-step11-historical-sec-backfill-event-classification-fixture-certification.zip'); m=json.loads(z.read('manifest.json')); assert len({e['path'] for e in m['entries']})==len(m['entries'])
          for e in m['entries']: assert hashlib.sha256(z.read(e['path'])).hexdigest()==e['sha256'],e['path']
          r=json.loads(z.read('frozen_authority_resolver_v3.json')); assert r['PASS'] and r['authority_ambiguities']==0
          d=json.loads(z.read('step11_fixture_decision.json')); assert d['decision']=='STEP11_HISTORICAL_SEC_BACKFILL_AND_EVENT_CLASSIFICATION_FIXTURE_CERTIFIED'; assert d['real_SEC_successes']>0 and d['future_filings_excluded']>0
          q=json.loads(z.read('sec_acquisition_report.json')); assert q['residual_sec_queries']==0 and q['unknown_sec_queries']==0
          PY
