name: Time Machine STEP 11 RETEST v3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['timemachine/src/step11_retest_v3.py','.github/workflows/timemachine-step11-retest-v3.yml']
permissions: {contents: read, actions: read}
jobs:
  retest-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: timemachine-step11-sec-backfill, path: /tmp/step11-base, github-token: '${{ github.token }}', repository: y44195070-sudo/microcap-radar-, run-id: '39978977002'}
      - uses: actions/download-artifact@v4
        with: {name: timemachine-step11-retest-v2, path: /tmp/step11-retest-v2, github-token: '${{ github.token }}', repository: y44195070-sudo/microcap-radar-, run-id: '39980565827'}
      - name: Run RETEST v3
        env: {STEP11_BASE: /tmp/step11-base, STEP11_RETEST_V2: /tmp/step11-retest-v2, SEC_USER_AGENT: 'MicrocapRadar-TimeMachine/1.1 research y44195070@gmail.com'}
        run: python timemachine/src/step11_retest_v3.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: timemachine-step11-retest-v3, path: timemachine/data/step11-retest-v3/, if-no-files-found: error, retention-days: 90}
