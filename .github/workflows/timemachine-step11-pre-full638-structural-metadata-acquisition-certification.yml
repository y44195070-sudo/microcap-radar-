name: Time Machine STEP11 Pre-Full638 Structural Metadata Acquisition Certification
on:
  workflow_dispatch:
    inputs:
      approved_certification_head:
        description: 'Separately approved exact merge HEAD for this live certification'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  structural-metadata-certification:
    runs-on: ubuntu-latest
    steps:
      - name: Exact approved HEAD guard before checkout or network
        env:
          ACTUAL_HEAD: '${{ github.sha }}'
          APPROVED_HEAD: '${{ inputs.approved_certification_head }}'
        run: |
          python - <<'PY'
          import os,re
          actual=os.environ['ACTUAL_HEAD']; approved=os.environ.get('APPROVED_HEAD','')
          if not re.fullmatch(r'[0-9a-f]{40}',approved) or actual != approved:
              raise SystemExit('STEP11_METADATA_ACQUISITION_POST_MERGE_HEAD_MISMATCH')
          print('STEP11_METADATA_ACQUISITION_EXACT_HEAD_GUARD_PASS')
          PY
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Compile isolated
        run: |
          mkdir -p /tmp/step11-compile-check /tmp/frozen-authorities /tmp/preflight-authority /tmp/step11-cert /tmp/sample32-oracle
          python - <<'PY'
          import py_compile
          files=['timemachine/src/step11_pre_full638_metadata_certification.py','timemachine/src/step11_frozen_authority_revalidate.py','timemachine/src/step11_structural_metadata_acquisition_execution.py','timemachine/src/step11_structural_metadata_acquisition_execution_v3.py','timemachine/src/step11_sample32_metadata_oracle_compare.py','timemachine/src/step11_frozen_step9_schema_adapter.py']
          for i,p in enumerate(files): py_compile.compile(p,cfile=f'/tmp/step11-compile-check/{i}.pyc',doraise=True)
          PY
      - name: Download immutable authorities before SEC network
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          for id in 12603520492 12603725128 12603356621 12603737037 12637518208 12637118813 12637078890; do
            gh api /repos/${{ github.repository }}/actions/artifacts/$id > /tmp/frozen-authorities/artifact-$id.json
            gh api /repos/${{ github.repository }}/actions/artifacts/$id/zip > /tmp/frozen-authorities/$id.zip
          done
          for pair in 'step9 40204385931' 'step10 40204853366' 'step11 40295222293'; do set -- $pair; gh api /repos/${{ github.repository }}/actions/runs/$2 > /tmp/frozen-authorities/run-$1.json; gh api /repos/${{ github.repository }}/actions/runs/$2/jobs > /tmp/frozen-authorities/jobs-$1.json; done
      - name: Revalidate frozen authorities before SEC network
        run: python timemachine/src/step11_frozen_authority_revalidate.py --artifact-dir /tmp/frozen-authorities --out /tmp/step11-cert/frozen_authority_revalidation.json
      - name: Revalidate approved implementation preflight before SEC network
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/12644816526 > /tmp/preflight-authority/artifact.json
          gh api /repos/${{ github.repository }}/actions/artifacts/12644816526/zip > /tmp/preflight-authority/preflight.zip
          python - <<'PY'
          import hashlib,json,zipfile
          p='/tmp/preflight-authority/preflight.zip'; expected='7ba46161ff5616ac11c58c48a48a553e5e17e95fab1e1df34a6a296564c11913'
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()==expected
          m=json.load(open('/tmp/preflight-authority/artifact.json')); assert m['id']==12644816526 and m['workflow_run']['id']==40310869024 and m['workflow_run']['head_sha']=='bcf7a3f28eee042000700528d11453947854574b'
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            vals=[json.loads(z.read(n)) for n in z.namelist() if n.endswith('final_decision.json')]
            assert any(x.get('decision')=='STEP11_PRE_FULL638_STRUCTURAL_METADATA_ACQUISITION_IMPLEMENTATION_READY' for x in vals)
          json.dump({'preflight_run':40310869024,'preflight_job':121531433013,'artifact_id':12644816526,'digest':'sha256:'+expected,'decision':'STEP11_PRE_FULL638_STRUCTURAL_METADATA_ACQUISITION_IMPLEMENTATION_READY','PASS':True},open('/tmp/step11-cert/preflight_authority.json','w'),sort_keys=True)
          PY
      - name: Extract authoritative certified638 and immutable Sample32 oracle
        run: |
          python - <<'PY'
          import json,zipfile
          z=zipfile.ZipFile('/tmp/frozen-authorities/12603520492.zip'); c=[n for n in z.namelist() if n.endswith('certified_identity_allowlist.json')]; assert len(c)==1
          x=json.loads(z.read(c[0])); rows=x if isinstance(x,list) else x.get('rows',x.get('certified_allowlist',x.get('occurrences'))); assert isinstance(rows,list) and len(rows)==638
          json.dump(rows,open('/tmp/step11-cert/certified638-raw.json','w'),sort_keys=True,separators=(',',':'))
          with zipfile.ZipFile('/tmp/frozen-authorities/12637078890.zip') as o: assert o.testzip() is None; o.extractall('/tmp/sample32-oracle')
          PY
      - name: Real immutable STEP9 schema compatibility gate before SEC network
        run: |
          python timemachine/src/step11_frozen_step9_schema_adapter.py --input /tmp/step11-cert/certified638-raw.json --out /tmp/step11-cert/certified638.json --report /tmp/step11-cert/real_schema_compatibility.json
          PYTHONPATH=timemachine/src python - <<'PY'
          import json,pathlib
          import step11_structural_metadata_acquisition_execution as live
          import step11_pre_full638_metadata_certification as core
          rows=live.norm_rows(live.load_rows(pathlib.Path('/tmp/step11-cert/certified638.json')))
          assert len(rows)==638 and len({r['issuer_cik'] for r in rows})==239
          plan=core.build_request_plan(rows); assert len(plan)==239 and core.COUNTERS['sec_requests']==0
          json.dump({'raw_rows':638,'normalized_rows':638,'normalized_issuer_cik_coverage':638,'unique_frozen_cik':239,'offline_request_plan_count':239,'sec_requests':0,'decision':'REAL_FROZEN_ALLOWLIST_TO_LIVE_RUNNER_SCHEMA_COMPATIBILITY_PASS'},open('/tmp/step11-cert/live_runner_schema_gate.json','w'),sort_keys=True)
          PY
      - name: Execute candidate-wide metadata-only core
        env:
          STEP11_METADATA_CERTIFICATION_ENABLE: 'YES'
          STEP11_APPROVED_CERTIFICATION_HEAD: '${{ inputs.approved_certification_head }}'
          STEP11_ACTUAL_HEAD: '${{ github.sha }}'
          SEC_USER_AGENT: 'MicrocapRadar historical-expansion-certification/1.0 contact: repository-owner'
        run: python timemachine/src/step11_structural_metadata_acquisition_execution_v3.py --mode certification --input638 /tmp/step11-cert/certified638.json --out /tmp/step11-cert/execution
      - name: Compare immutable Sample32 oracle
        run: python timemachine/src/step11_sample32_metadata_oracle_compare.py --oracle-dir /tmp/sample32-oracle --input638 /tmp/step11-cert/certified638.json --pass-a /tmp/step11-cert/execution/pass_a.json --acquisition-state /tmp/step11-cert/execution/acquisition_state_manifest.json --out /tmp/step11-cert/execution/sample32_oracle_comparison.json
      - name: Assert core and Sample32 before security
        run: |
          python - <<'PY'
          import json
          r='/tmp/step11-cert/execution/'
          c=json.load(open(r+'core_decision.json')); e=json.load(open(r+'acquisition_eligibility.json')); o=json.load(open(r+'sample32_oracle_comparison.json')); n=json.load(open(r+'network_audit.json'))
          assert c['decision']=='CORE_METADATA_REPLAY_VALIDATED' and c['candidate_count']==638
          assert e['status']=='PASS' and e['incomplete_frozen_cik']==0 and e['source_acquisition_incomplete_candidates']==0
          assert o['PASS'] and o['sample_count']==32 and not o['oracle_mutated']
          assert n['provider_requests']==n['current_identifier_requests']==n['residual4388_requests']==n['filing_body_requests']==n['exhibit_requests']==n['xbrl_requests']==n['pass_b_network_requests']==0
          PY
      - name: Security scanner unchanged
        run: |
          python timemachine/src/step11_fixture_security_scan_v5.py --out /tmp/step11-cert/security.json timemachine/src .github/workflows
          python - <<'PY'
          import json
          x=json.load(open('/tmp/step11-cert/security.json')); assert x['PASS'] is True and x['confirmed_secrets']==0 and x['credential_bearing_urls']==0 and x['authorization_headers']==0 and x['security_regression_v3']['PASS'] is True
          PY
      - name: Protected state audit
        run: |
          git diff --exit-code HEAD -- v2 timemachine/data timemachine/snapshots
          python - <<'PY'
          import json,subprocess
          dirty=subprocess.check_output(['git','status','--porcelain'],text=True).strip().splitlines(); assert not any(' v2/' in x or x.startswith('?? v2/') for x in dirty)
          json.dump({'v2_changes':0,'production_changes':0,'prediction_changes':0,'prediction_identity_changes':0,'pred_id_changes':0,'rule_engine_changes':0,'context_changes':0,'snapshot_changes':0,'frozen_authority_changes':0,'sample32_changes':0,'residual4388_changes':0,'PASS':True},open('/tmp/step11-cert/protected_state.json','w'),sort_keys=True)
          PY
      - name: Final certification assertion only after all mandatory gates
        run: |
          python - <<'PY'
          import json
          r='/tmp/step11-cert/execution/'
          e=json.load(open(r+'acquisition_eligibility.json')); o=json.load(open(r+'sample32_oracle_comparison.json')); s=json.load(open('/tmp/step11-cert/security.json')); p=json.load(open('/tmp/step11-cert/protected_state.json'))
          assert e['status']=='PASS' and o['PASS'] and s['PASS'] and p['PASS']
          d={'decision':'STEP11_PRE_FULL638_STRUCTURAL_METADATA_ACQUISITION_CERTIFIED','metadata_scope':'METADATA_ONLY_SCOPE','candidate_count':638,'acquisition_eligibility':'PASS','sample32_oracle':'PASS','security':'PASS','protected_state':'PASS'}
          json.dump(d,open(r+'final_decision.json','w'),sort_keys=True,separators=(',',':'))
          print(d['decision'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step11-pre-full638-structural-metadata-acquisition-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/step11-cert
          if-no-files-found: error
          retention-days: 90
