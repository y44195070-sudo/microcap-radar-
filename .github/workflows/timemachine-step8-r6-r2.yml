name: Time Machine STEP 8-R6-R2 Residual Evidence Closure
on:
  workflow_dispatch:
  push:
    paths:
      - 'timemachine/step8-r6-r2-trigger.txt'
permissions:
  contents: read
  actions: read
jobs:
  residual-evidence-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download frozen artifacts
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/12581859040/zip > /tmp/r6r.zip
          gh api repos/${{ github.repository }}/actions/artifacts/12582196400/zip > /tmp/r6.zip
          gh api repos/${{ github.repository }}/actions/artifacts/12580323566/zip > /tmp/r5r.zip
          gh api repos/${{ github.repository }}/actions/artifacts/12564074295/zip > /tmp/r5.zip
          gh api repos/${{ github.repository }}/actions/artifacts/12557232809/zip > /tmp/sec.zip
          gh api repos/${{ github.repository }}/actions/artifacts/12559529678/zip > /tmp/r2.zip
      - name: Verify frozen R6-R and R6 digests
        run: |
          echo 'b556b2a9d364a5f54bba37b33bae2d6ed9139d98d5e433e1e39623441b994991  /tmp/r6r.zip' | sha256sum -c -
          echo '6d6c61b43e59212dcb9dcdb4ab2fcbcdaafdc6ee42a15bf178a7cc306ad3346e  /tmp/r6.zip' | sha256sum -c -
          sha256sum /tmp/r6r.zip /tmp/r6.zip /tmp/r5r.zip /tmp/r5.zip /tmp/sec.zip /tmp/r2.zip | tee /tmp/frozen-input-sha256.txt
      - name: Run STEP 8-R6-R2
        run: |
          rm -rf /tmp/r6r2-out
          python timemachine/src/step8_r6_r2_residual_evidence_closure.py --r6r /tmp/r6r.zip --r6 /tmp/r6.zip --r5r /tmp/r5r.zip --r5 /tmp/r5.zip --sec /tmp/sec.zip --r2 /tmp/r2.zip --out /tmp/r6r2-out
          cp /tmp/frozen-input-sha256.txt /tmp/r6r2-out/frozen-input-sha256.txt
      - name: Verify required evidence
        run: |
          set -e
          for f in frozen-input-verification.json residual-target-reconstruction.json gold-open-40.json accession-recovery-40.json source-recovery-summary.json value-extraction-40-final.json residual-semantic-52.json residual-semantic-final-summary.json negative-regression-16-final.json gold-318-final-regression.json parser-final-metrics.json spwrw-gold-control.json repaired-authorized-capital-facts.json repaired-capital-facts-manifest.json new-corporate-lineage-audit.json root-cause-final-closure.json pit-regression.json context-diff.json leakage-report.json supply-semantics-audit.json protected-output-integrity.json qa-report.json manifest.json step8-r6-r2-verdict.json; do test -s /tmp/r6r2-out/$f; done
          test $(find /tmp/r6r2-out/repaired-daily-context -name '*.jsonl.gz' | wc -l) -eq 20
      - name: Verify protected outputs unchanged
        run: |
          test -z "$(git status --porcelain -- v2/ timemachine/data/)"
          test -z "$(git diff HEAD^ HEAD -- v2/)"
          test -z "$(git diff HEAD^ HEAD -- timemachine/src/step9* .github/workflows/*step9*)"
      - uses: actions/upload-artifact@v4
        with:
          name: timemachine-step8-r6-r2-residual-evidence-closure
          path: /tmp/r6r2-out/
          if-no-files-found: error
          retention-days: 90
