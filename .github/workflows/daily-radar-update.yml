name: Daily Radar Update

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 Asia/Seoul (UTC+9)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect and validate daily data
        run: python scripts/daily_update.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, pathlib
          files=list(pathlib.Path('v2/data').rglob('*.json'))
          for p in files:
              with p.open(encoding='utf-8') as f: json.load(f)
          print('validated',len(files),'json files')
          PY

      - name: Commit only validated changes
        run: |
          git config user.name 'microcap-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/data
          if git diff --cached --quiet; then
            echo 'No validated data changes.'
            exit 0
          fi
          git commit -m "data: daily radar update $(TZ=Asia/Seoul date +%F)"
          git push
