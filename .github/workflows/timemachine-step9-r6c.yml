name: Time Machine STEP9-R6C Prediction Identity V2 Readiness Gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'timemachine/triggers/step9-r6c.txt'
permissions:
  contents: read
  actions: read
jobs:
  step9-r6c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download frozen evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12592433720/zip > /tmp/r3.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12583614872/zip > /tmp/context.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12586847514/zip > /tmp/r4.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12591321235/zip > /tmp/r6br.zip
      - name: Verify frozen digests
        run: |
          set -euo pipefail
          echo '27d1501f5d46883574c0f546a21e276953f797ef1531f6080754fe13582b80ce  /tmp/r3.zip' | sha256sum -c -
          echo '4a4b15c85c50f7034a692e92b77f8665af77ee40c22e2997b06981b8cd52dc51  /tmp/context.zip' | sha256sum -c -
          echo '9efb5959cf043e674455d4d2778121db67e993eb0b5059d40a332e3774db2a00  /tmp/r4.zip' | sha256sum -c -
          echo 'e21d081cc4d97ecd16835c36f56631ac1d43b60f3d86c78ff57ccfe9e2980a8e  /tmp/r6br.zip' | sha256sum -c -
      - name: Run readiness gate
        run: python timemachine/src/step9_r6c_prediction_identity_v2_readiness.py --r3 /tmp/r3.zip --context /tmp/context.zip --r4 /tmp/r4.zip --r6br /tmp/r6br.zip --out /tmp/r6c --head-sha ${{ github.sha }}
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timemachine-step9-r6c-prediction-identity-v2-readiness-gate
          path: /tmp/r6c/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce fail-closed gate semantics
        if: always()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/r6c/technical_verdict.json'))
          assert x['STEP9']=='STEP9_BLOCKED' and x['STEP10_GATE']=='BLOCKED',x
          assert x['technical_verdict'] in ['STEP9_R6C_READY_FOR_PREDICTION_IDENTITY_V2_IMPLEMENTATION','STEP9_R6C_BLOCKED_UNRESOLVED_SECURITY_IDENTITY'],x
          PY
