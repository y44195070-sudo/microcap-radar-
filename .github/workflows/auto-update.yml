name: Microcap Radar Auto Update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set update timestamp
        run: |
          echo "LAST_UPDATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Create update status
        run: |
          mkdir -p data
          cat > data/update-status.json << EOF
          {
            "status": "ok",
            "last_update": "${LAST_UPDATE}",
            "source": "GitHub Actions",
            "message": "Microcap Radar automatic update is running"
          }
          EOF

      - name: Commit updated data
        run: |
          git config user.name "microcap-radar-bot"
          git config user.email "actions@github.com"
          git add data/update-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Auto update Microcap Radar data"
          git push
