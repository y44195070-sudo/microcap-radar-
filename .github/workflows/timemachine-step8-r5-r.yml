name: Time Machine STEP 8-R5-R Semantic Adjudication
on:
  workflow_dispatch:
  push:
    paths:
      - 'timemachine/step8-r5-r-trigger.txt'
permissions:
  contents: read
  actions: read
jobs:
  semantic-adjudication:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen STEP 8-R5 Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/actions/artifacts/12564074295/zip > /tmp/r5.zip
      - name: Verify frozen R5 Artifact digest
        run: echo 'b49fc8be7986883f35bb51509abb8870f2bc9dd85d470c866efd21ebc213900f  /tmp/r5.zip' | sha256sum -c -
      - name: Download frozen STEP7I-R2 SEC evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/actions/artifacts/12557232809/zip > /tmp/sec.zip
      - name: Download frozen STEP8-R2 Context
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/actions/artifacts/12559529678/zip > /tmp/r2.zip
      - name: Run STEP 8-R5-R semantic adjudication and retrieval closure
        run: |
          rm -rf /tmp/r5r-out
          python timemachine/src/step8_r5_r_semantic_adjudication.py --r5 /tmp/r5.zip --sec /tmp/sec.zip --r2 /tmp/r2.zip --out /tmp/r5r-out
      - name: Verify required R5-R evidence files
        run: |
          set -e
          for f in r5-frozen-input-verification.json retrieval-failure-recovery.json corpus-coverage-final.json semantic-adjudication-all.json automated-619-breakdown.json ambiguous-1438-resolution.json corporate-authorized-cases.json corporate-authorized-values.json corporate-authorized-pit-eligibility.json spwrw-semantic-gold-control.json step7i-r2-lineage-audit.json root-cause-report.json authorized-shares-semantic-audit.json conditional-gate-validation.json context-integrity.json v2-integrity.json qa-report.json manifest.json step8-r5-r-verdict.json; do test -s /tmp/r5r-out/$f; done
      - name: Verify protected outputs unchanged
        run: |
          test -z "$(git status --porcelain -- v2/)"
          test -z "$(git status --porcelain -- timemachine/data/)"
      - uses: actions/upload-artifact@v4
        with:
          name: timemachine-step8-r5-r-semantic-adjudication
          path: /tmp/r5r-out/
          if-no-files-found: error
          retention-days: 90
