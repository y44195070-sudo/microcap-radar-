name: Time Machine STEP11 Metadata Implementation Preflight Retry
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Compile isolated
        run: |
          mkdir -p /tmp/step11-compile-check /tmp/frozen-authorities /tmp/preflight-retry
          python - <<'PY'
          import py_compile
          for i,p in enumerate(['timemachine/src/step11_pre_full638_metadata_certification.py','timemachine/src/step11_pre_full638_metadata_repair_guard.py','timemachine/src/step11_frozen_authority_revalidate.py']): py_compile.compile(p,cfile=f'/tmp/step11-compile-check/{i}.pyc',doraise=True)
          PY
      - name: Freeze Sample32 policy before any SEC network
        run: python timemachine/src/step11_pre_full638_metadata_repair_guard.py --out /tmp/preflight-retry/repair-guard
      - name: Download exact frozen GitHub authority artifacts and provenance read-only
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          for id in 12603520492 12603725128 12603356621 12603737037 12637518208 12637118813 12637078890; do
            gh api -H 'Accept: application/vnd.github+json' /repos/${{ github.repository }}/actions/artifacts/$id > /tmp/frozen-authorities/artifact-$id.json
            gh api -H 'Accept: application/vnd.github+json' /repos/${{ github.repository }}/actions/artifacts/$id/zip > /tmp/frozen-authorities/$id.zip
          done
          gh api /repos/${{ github.repository }}/actions/runs/40204385931 > /tmp/frozen-authorities/run-step9.json
          gh api /repos/${{ github.repository }}/actions/runs/40204385931/jobs > /tmp/frozen-authorities/jobs-step9.json
          gh api /repos/${{ github.repository }}/actions/runs/40204853366 > /tmp/frozen-authorities/run-step10.json
          gh api /repos/${{ github.repository }}/actions/runs/40204853366/jobs > /tmp/frozen-authorities/jobs-step10.json
          gh api /repos/${{ github.repository }}/actions/runs/40295222293 > /tmp/frozen-authorities/run-step11.json
          gh api /repos/${{ github.repository }}/actions/runs/40295222293/jobs > /tmp/frozen-authorities/jobs-step11.json
      - name: Independently verify frozen authority bytes semantics and provenance
        run: python timemachine/src/step11_frozen_authority_revalidate.py --artifact-dir /tmp/frozen-authorities --out /tmp/preflight-retry/authority_revalidation.json
      - name: Run original network-disabled preflight only
        run: python timemachine/src/step11_pre_full638_metadata_certification.py --mode preflight --out /tmp/preflight-retry/original-preflight
      - name: Assert zero acquisition and no certification
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/preflight-retry/original-preflight/preflight_test_report.json'))
          assert x['network_requests']==0 and x['sec_requests']==0 and x['provider_requests']==0 and x['current_identifier_requests']==0
          print('ACTUAL_SEC_REQUESTS=0'); print('CERTIFICATION_EXECUTION=NOT_STARTED')
          PY
      - name: Protected diff from pre-repair main
        run: |
          git diff --name-only 00675e0e089d169894b3a0fe435d525c69dc138a...HEAD > /tmp/preflight-retry/changed_files.txt
          python - <<'PY'
          from pathlib import Path
          allowed={'timemachine/src/step11_pre_full638_metadata_repair_guard.py','timemachine/src/step11_frozen_authority_revalidate.py','.github/workflows/timemachine-step11-metadata-preflight-blocker-repair-v1.yml','.github/workflows/timemachine-step11-metadata-preflight-retry.yml','.github/workflows/timemachine-step11-frozen-authority-binding-repair-v1.yml','timemachine/src/step11_frozen_authority_revalidate_tests.py'}
          got={x for x in Path('/tmp/preflight-retry/changed_files.txt').read_text().splitlines() if x}; assert not (got-allowed), sorted(got-allowed)
          PY
      - name: Security scanner unchanged
        run: |
          python timemachine/src/step11_fixture_security_scan_v5.py --out /tmp/preflight-retry/security_report_redacted.json timemachine/src .github/workflows
          python - <<'PY'
          import json
          x=json.load(open('/tmp/preflight-retry/security_report_redacted.json')); assert x['PASS'] is True and x['confirmed_secrets']==0 and x['credential_bearing_urls']==0 and x['authorization_headers']==0 and x['security_regression_v3']['PASS'] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step11-pre-full638-metadata-implementation-preflight-retry-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/preflight-retry
          if-no-files-found: error
          retention-days: 90
