name: STEP11 SEC Historical Certification Plan
on:
  push:
    branches: [main]
    paths:
      - 'timemachine/triggers/step11-historical-sec-backfill-event-classification-certification-plan.txt'
      - '.github/workflows/timemachine-step11-plan.yml'
      - 'timemachine/src/step11_historical_sec_backfill_event_classification_certification_plan.py'
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile
        run: python -m py_compile timemachine/src/step11_historical_sec_backfill_event_classification_certification_plan.py
      - name: Reacquire and verify frozen authorities
        run: |
          mkdir -p /tmp/frozen
          gh api /repos/${{ github.repository }}/actions/artifacts/12603520492/zip > /tmp/frozen/s9.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12603725128/zip > /tmp/frozen/s9c.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12603356621/zip > /tmp/frozen/s10.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12603737037/zip > /tmp/frozen/s10c.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12602635150/zip > /tmp/frozen/gov.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12602225859/zip > /tmp/frozen/govc.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12603066455/zip > /tmp/frozen/p9.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12602074250/zip > /tmp/frozen/p9c.zip
          python - <<'PY'
          import hashlib,zipfile,json
          exp={'s9.zip':'3ec6a1f4ec88ff284eade8d7730b301ea65d2d5a932feb11a0f76c0592c7c19c','s9c.zip':'a77f89137bfe5c299e46e39864e37826cc03ce84c3cbbede8c681bf538e31238','s10.zip':'b9a5a4d40bfc318288a15337fd74c47dcff93de619d6aa281ea9de6001ebf1de','s10c.zip':'914587ecbbe5bcb579aff464b11c8fec0469f7400ee8eddc3d757f9ab30e181f','gov.zip':'5e256090278d2fdbfb76b190d965c64e7e3251ac2e67a061c55b8a76cd7549c4','govc.zip':'b6543ba219317b0beac67a683fea9ec4b6711a2677ed0c16467133ed2b94da64','p9.zip':'d6c4e4703a8614907631345f6312933da06bd2c55e9f09a008759d606a51cd50','p9c.zip':'fbc1852d688859f41d543853ac45e798a8df89f378949bcb82f2f0caeaccf65e'}
          for n,h in exp.items():
            b=open('/tmp/frozen/'+n,'rb').read(); assert hashlib.sha256(b).hexdigest()==h; assert zipfile.ZipFile('/tmp/frozen/'+n).testzip() is None
          s10=zipfile.ZipFile('/tmp/frozen/s10.zip')
          assert json.loads(s10.read('step10_decision.json'))['decision']=='STEP10_CERTIFIED_ONLY_CONSUMPTION_GUARD_CERTIFIED'
          b=json.loads(s10.read('occurrence_boundary_verification.json')); assert (b['total'],b['certified'],b['residual'],b['overlap'],b['missing'],b['duplicates'])==(5026,638,4388,0,0,0)
          PY
      - name: Execute deterministic plan twice
        run: |
          python timemachine/src/step11_historical_sec_backfill_event_classification_certification_plan.py --out /tmp/a --head-sha '${{ github.sha }}'
          python timemachine/src/step11_historical_sec_backfill_event_classification_certification_plan.py --out /tmp/b --head-sha '${{ github.sha }}'
          python - <<'PY'
          import pathlib,hashlib,json
          A=pathlib.Path('/tmp/a'); B=pathlib.Path('/tmp/b')
          assert {p.name for p in A.glob('*.json')}=={p.name for p in B.glob('*.json')}
          for p in A.glob('*.json'): assert hashlib.sha256(p.read_bytes()).hexdigest()==hashlib.sha256((B/p.name).read_bytes()).hexdigest()
          assert json.load(open(A/'negative_plan_tests.json'))['count']==35
          assert json.load(open(A/'positive_plan_tests.json'))['count']==15
          PY
      - name: Record existing STEP11 prototypes conservatively
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          A=pathlib.Path('/tmp/a')
          inv=[
            {'component':'timemachine/src/step10_certified_only_consumption_guard.py','classification':'REUSABLE','reason':'frozen STEP10 certified-only boundary; read-only'},
            {'component':'timemachine/src/step11_sec_backfill.py','classification':'REQUIRES_REVALIDATION','reason':'pre-existing full STEP11 prototype uses hard-coded CIK/security cases and current/custom historical mappings; not authoritative until bounded fixture certification'},
            {'component':'.github/workflows/timemachine-step11.yml','classification':'REQUIRES_REVALIDATION','reason':'pre-existing full backfill workflow; MUST NOT execute during Plan'},
            {'component':'.github/workflows/timemachine-step11-retest*.yml','classification':'DEPRECATED','reason':'pre-existing retest harnesses are not Plan authority'},
            {'component':'current-state identity/security-master enrichment','classification':'UNSAFE_CURRENT_STATE_DEPENDENT','reason':'forbidden for historical truth'}]
          (A/'existing_component_inventory.json').write_text(json.dumps(inv,sort_keys=True,indent=2)+'\n')
          # Rebuild manifest after the independently discovered inventory correction.
          entries=[]
          for p in sorted(A.glob('*.json')):
            if p.name=='manifest.json': continue
            b=p.read_bytes(); entries.append({'path':p.name,'sha256':hashlib.sha256(b).hexdigest(),'size':len(b)})
          (A/'manifest.json').write_text(json.dumps({'plan_version':'STEP11_HISTORICAL_SEC_PLAN_V1','entries':entries,'entry_count':len(entries)},sort_keys=True,indent=2)+'\n')
          PY
      - name: Protected diff and non-execution audit
        run: |
          python - <<'PY'
          import subprocess,json,pathlib
          fs=subprocess.check_output(['git','diff','--name-only','d07e4cbae552ffed2391904e76bcbae0a5584397','HEAD'],text=True).splitlines()
          allowed={'.github/workflows/timemachine-step11-historical-sec-backfill-event-classification-certification-plan.yml','.github/workflows/timemachine-step11-plan.yml','timemachine/triggers/step11-historical-sec-backfill-event-classification-certification-plan.txt','timemachine/src/step11_historical_sec_backfill_event_classification_certification_plan.py'}
          assert set(fs)<=allowed,fs; assert not any(x.startswith('v2/') for x in fs); assert 'timemachine/src/step11_sec_backfill.py' not in fs
          json.dump({'changed_files':fs,'forbidden_mutations':0,'v2_mutations':0,'full_step11_backfill_executions':0,'PASS':True},open('/tmp/a/protected_diff_audit.json','w'),sort_keys=True,indent=2)
          # refresh manifest
          import hashlib
          A=pathlib.Path('/tmp/a'); entries=[]
          for p in sorted(A.glob('*.json')):
            if p.name=='manifest.json': continue
            b=p.read_bytes(); entries.append({'path':p.name,'sha256':hashlib.sha256(b).hexdigest(),'size':len(b)})
          (A/'manifest.json').write_text(json.dumps({'plan_version':'STEP11_HISTORICAL_SEC_PLAN_V1','entries':entries,'entry_count':len(entries)},sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: step11-historical-sec-backfill-event-classification-certification-plan-checkpoint
          path: /tmp/a/checkpoint.json
      - name: Upload certification plan
        uses: actions/upload-artifact@v4
        with:
          name: step11-historical-sec-backfill-event-classification-certification-plan
          path: /tmp/a/*.json
      - name: Independent artifact verification
        run: |
          sleep 4
          python - <<'PY'
          import os,json,subprocess,zipfile,hashlib
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['GITHUB_RUN_ID']
          arts=json.loads(subprocess.check_output(['gh','api',f'/repos/{repo}/actions/runs/{run}/artifacts'],text=True))['artifacts']; assert len(arts)==2
          for a in arts:
            p='/tmp/'+a['name']+'.zip'; open(p,'wb').write(subprocess.check_output(['gh','api',f"/repos/{repo}/actions/artifacts/{a['id']}/zip"])); h=hashlib.sha256(open(p,'rb').read()).hexdigest(); assert a.get('digest') in (None,'sha256:'+h); assert zipfile.ZipFile(p).testzip() is None
          z=zipfile.ZipFile('/tmp/step11-historical-sec-backfill-event-classification-certification-plan.zip'); m=json.loads(z.read('manifest.json')); assert len({e['path'] for e in m['entries']})==len(m['entries'])
          for e in m['entries']: assert hashlib.sha256(z.read(e['path'])).hexdigest()==e['sha256']
          assert json.loads(z.read('step11_plan_decision.json'))['decision']=='STEP11_HISTORICAL_SEC_BACKFILL_AND_EVENT_CLASSIFICATION_CERTIFICATION_PLAN_GO'
          PY
