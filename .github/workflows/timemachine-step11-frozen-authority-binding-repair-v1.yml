name: Time Machine STEP11 Frozen Authority Binding Repair V1
on:
  push:
    branches: [step11-metadata-frozen-authority-revalidation-binding-repair-v1]
    paths:
      - 'timemachine/src/step11_frozen_authority_revalidate.py'
      - 'timemachine/src/step11_frozen_authority_revalidate_tests.py'
      - '.github/workflows/timemachine-step11-metadata-preflight-retry.yml'
      - '.github/workflows/timemachine-step11-frozen-authority-binding-repair-v1.yml'
permissions:
  contents: read
  actions: read
jobs:
  repair-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Compile isolated
        run: |
          mkdir -p /tmp/step11-compile-check /tmp/frozen-authorities /tmp/repair-v1
          python - <<'PY'
          import py_compile
          for i,p in enumerate(['timemachine/src/step11_frozen_authority_revalidate.py','timemachine/src/step11_frozen_authority_revalidate_tests.py']): py_compile.compile(p,cfile=f'/tmp/step11-compile-check/{i}.pyc',doraise=True)
          PY
      - name: Download immutable authorities and GitHub provenance read-only
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          for id in 12603520492 12603725128 12603356621 12603737037 12637518208 12637118813 12637078890; do
            gh api /repos/${{ github.repository }}/actions/artifacts/$id > /tmp/frozen-authorities/artifact-$id.json
            gh api /repos/${{ github.repository }}/actions/artifacts/$id/zip > /tmp/frozen-authorities/$id.zip
          done
          for pair in 'step9 40204385931' 'step10 40204853366' 'step11 40295222293'; do
            set -- $pair; gh api /repos/${{ github.repository }}/actions/runs/$2 > /tmp/frozen-authorities/run-$1.json; gh api /repos/${{ github.repository }}/actions/runs/$2/jobs > /tmp/frozen-authorities/jobs-$1.json
          done
      - name: Validate actual frozen authorities
        run: python timemachine/src/step11_frozen_authority_revalidate.py --artifact-dir /tmp/frozen-authorities --out /tmp/repair-v1/authority_revalidation.json
      - name: Run ten binding regression tests
        run: python timemachine/src/step11_frozen_authority_revalidate_tests.py /tmp/frozen-authorities | tee /tmp/repair-v1/regression_tests.json
      - name: Record root cause and zero network audit
        run: |
          python - <<'PY'
          import json
          json.dump({'root_cause_path':'PATH_B','classification':'VERIFIER_REQUIRES_NONEXISTENT_HISTORICAL_PAYLOAD_BINDING','historical_contract':'STEP9 runner received head_sha/base_sha but no run_id/job_id arguments','binding_model':'PAYLOAD_INTEGRITY_PLUS_GITHUB_ARTIFACT_PROVENANCE'},open('/tmp/repair-v1/root_cause.json','w'),sort_keys=True)
          json.dump({'github_authority_artifact_downloads':7,'preflight_retry_dispatches':0,'sec_requests':0,'provider_requests':0,'current_identifier_requests':0,'residual4388_requests':0,'filing_body_requests':0,'xbrl_requests':0,'certification_execution':0},open('/tmp/repair-v1/network_audit.json','w'),sort_keys=True)
          PY
      - name: Protected diff
        run: |
          git diff --name-only c451547b48678b709b2d38351593371c00a60318...HEAD | tee /tmp/repair-v1/changed_files.txt
          python - <<'PY'
          from pathlib import Path
          allowed={'timemachine/src/step11_frozen_authority_revalidate.py','timemachine/src/step11_frozen_authority_revalidate_tests.py','.github/workflows/timemachine-step11-metadata-preflight-retry.yml','.github/workflows/timemachine-step11-frozen-authority-binding-repair-v1.yml'}
          got={x for x in Path('/tmp/repair-v1/changed_files.txt').read_text().splitlines() if x}; assert got<=allowed and not any(x.startswith('v2/') for x in got),sorted(got-allowed)
          PY
      - name: Security scanner unchanged
        run: |
          python timemachine/src/step11_fixture_security_scan_v5.py --out /tmp/repair-v1/security.json timemachine/src .github/workflows
          python - <<'PY'
          import json
          x=json.load(open('/tmp/repair-v1/security.json')); assert x['PASS'] is True and x['confirmed_secrets']==0 and x['credential_bearing_urls']==0 and x['authorization_headers']==0 and x['security_regression_v3']['PASS'] is True
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step11-frozen-authority-binding-repair-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/repair-v1
          if-no-files-found: error
          retention-days: 90
