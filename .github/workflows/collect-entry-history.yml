name: Collect ENTRY dev history (2025-11-26..2026-03-06)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Collect grouped daily + splits
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/collect_entry_history.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entry-dev-history
          path: entry-history-artifact/
          retention-days: 90
          if-no-files-found: error
