name: Time Machine STEP9-R6B-R Residual Identity Source Gap Closure
on:
  workflow_dispatch:
  push:
    paths:
      - 'timemachine/triggers/step9-r6br.txt'
permissions:
  contents: read
  actions: read
jobs:
  step9-r6br:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize diagnostic output
        run: mkdir -p /tmp/r6br
      - name: Download frozen original artifacts by ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12590571940/zip > /tmp/r6b.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12583614872/zip > /tmp/context.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12586847514/zip > /tmp/r4.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12589650461/zip > /tmp/r5.zip
      - name: Verify frozen original ZIP digests
        run: |
          set -euo pipefail
          echo '83d20954c0b3c59ed49dec9b38450747a1a0a8af4eb42a739912c8765c6a6007  /tmp/r6b.zip' | sha256sum -c -
          echo '4a4b15c85c50f7034a692e92b77f8665af77ee40c22e2997b06981b8cd52dc51  /tmp/context.zip' | sha256sum -c -
          echo '9efb5959cf043e674455d4d2778121db67e993eb0b5059d40a332e3774db2a00  /tmp/r4.zip' | sha256sum -c -
          echo '7f9d230aebe1626f5968be06ad09fdb1f8c598c69afccaf0d0eff4c1f79cb302  /tmp/r5.zip' | sha256sum -c -
      - name: Run STEP9-R6B-R forensic closure
        run: python timemachine/src/step9_r6br_residual_identity_source_gap_closure.py --r6b /tmp/r6b.zip --context /tmp/context.zip --r4 /tmp/r4.zip --r5 /tmp/r5.zip --out /tmp/r6br --head-sha ${{ github.sha }}
      - name: Verify protection and isolation
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/r6br/protected-output-integrity.json')); assert p['PASS'],p
          o=json.load(open('/tmp/r6br/outcome-isolation-audit.json')); assert o['outcome_access_count']==0 and o['outcome_calculations']==0,o
          n=json.load(open('/tmp/r6br/prediction-snapshot-nonmutation-audit.json')); assert n['PASS'],n
          PY
      - name: Upload diagnostic artifact regardless of verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timemachine-step9-r6br-residual-identity-source-gap-closure
          path: /tmp/r6br/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce closure verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/r6br/step9-r6br-verdict.json'))
          assert x['verdict'] in ['STEP9_R6BR_UPSTREAM_SOURCE_GAP_CERTIFIED','STEP9_R6BR_PIPELINE_PROPAGATION_DEFECT','STEP9_R6BR_MIXED_SOURCE_GAP_AND_PIPELINE_DEFECT'],x
          PY
