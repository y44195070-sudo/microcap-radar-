name: Collect ACTION 3B B1 424B5
on:
  workflow_dispatch:
    inputs:
      accessions_file:
        description: 'Repository JSON containing the 62 B1 accessions with cik/accession/primaryDocument'
        required: true
        default: 'data/action-3b-b1-424b5-accessions.json'
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Collect primary 424B5 documents
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_USER_AGENT_VAR: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/collect_3b_b1_424b5.py --accessions "${{ inputs.accessions_file }}"
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: action-3b-b1-424b5
          path: action-3b-b1-424b5-artifact/
          if-no-files-found: error
