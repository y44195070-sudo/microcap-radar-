name: Time Machine STEP 8 PIT Pipeline
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/timemachine-step8.yml'
permissions:
  contents: read
jobs:
  step8:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run STEP 8 PIT pipeline
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python timemachine/src/step8_pit_pipeline.py
      - name: Upload STEP 8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: timemachine-step8-pit
          path: timemachine/data/step8/
          if-no-files-found: error
          retention-days: 30
