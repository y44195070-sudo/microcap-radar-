name: Collect ACTION 3B B2 8-K
on:
  workflow_dispatch:
    inputs:
      accessions_file:
        description: 'Repository JSON containing B2 8-K accessions with cik/accession/primaryDocument/form/items/known_at'
        required: true
        default: 'data/action-3b-b2-8k-accessions.json'
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Collect primary 8-K documents
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEC_USER_AGENT_VAR: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/collect_3b_b2_8k.py --accessions "${{ inputs.accessions_file }}"
      - name: Upload source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-3b-b2-8k
          path: action-3b-b2-8k-artifact/
          if-no-files-found: error
