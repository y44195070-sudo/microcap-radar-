name: Time Machine STEP 8-R6-R Final Semantic Closure
on:
  workflow_dispatch:
  push:
    paths:
      - 'timemachine/step8-r6-r-trigger.txt'
permissions:
  contents: read
  actions: read
jobs:
  final-semantic-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen R6
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api repos/${{ github.repository }}/actions/artifacts/12582196400/zip > /tmp/r6.zip
      - name: Verify frozen R6 digest
        run: echo '6d6c61b43e59212dcb9dcdb4ab2fcbcdaafdc6ee42a15bf178a7cc306ad3346e  /tmp/r6.zip' | sha256sum -c -
      - name: Download frozen R5-R
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api repos/${{ github.repository }}/actions/artifacts/12580323566/zip > /tmp/r5r.zip
      - name: Download frozen R5
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api repos/${{ github.repository }}/actions/artifacts/12564074295/zip > /tmp/r5.zip
      - name: Download frozen STEP7I-R2
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api repos/${{ github.repository }}/actions/artifacts/12557232809/zip > /tmp/sec.zip
      - name: Download frozen STEP8-R2
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api repos/${{ github.repository }}/actions/artifacts/12559529678/zip > /tmp/r2.zip
      - name: Record frozen digests
        run: sha256sum /tmp/r6.zip /tmp/r5r.zip /tmp/r5.zip /tmp/sec.zip /tmp/r2.zip | tee /tmp/frozen-input-sha256.txt
      - name: Run STEP 8-R6-R
        run: |
          rm -rf /tmp/r6r-out
          python timemachine/src/step8_r6_r_final_semantic_closure.py --r6 /tmp/r6.zip --r5r /tmp/r5r.zip --r5 /tmp/r5.zip --sec /tmp/sec.zip --r2 /tmp/r2.zip --out /tmp/r6r-out
          cp /tmp/frozen-input-sha256.txt /tmp/r6r-out/frozen-input-sha256.txt
      - name: Verify required evidence
        run: |
          set -e
          for f in frozen-input-verification.json gold-value-failure-set-40.json value-extraction-repair.json value-extraction-summary.json semantic-closure-271.json semantic-closure-final-summary.json gold-318-final-regression.json parser-precision-recall.json negative-regression-16-category.json spwrw-gold-control.json repaired-authorized-capital-facts.json repaired-capital-facts-manifest.json new-corporate-lineage-audit.json root-cause-final-closure.json pit-regression.json context-diff.json leakage-report.json supply-semantics-audit.json protected-output-integrity.json qa-report.json manifest.json step8-r6-r-verdict.json; do test -s /tmp/r6r-out/$f; done
          test $(find /tmp/r6r-out/repaired-daily-context -name '*.jsonl.gz' | wc -l) -eq 20
      - name: Verify protected repository outputs unchanged
        run: |
          test -z "$(git status --porcelain -- v2/ timemachine/data/)"
          test -z "$(git diff HEAD^ HEAD -- v2/)"
          test -z "$(git diff HEAD^ HEAD -- timemachine/src/step9* .github/workflows/*step9*)"
      - uses: actions/upload-artifact@v4
        with:
          name: timemachine-step8-r6-r-final-semantic-closure
          path: /tmp/r6r-out/
          if-no-files-found: error
          retention-days: 90
