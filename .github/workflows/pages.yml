name: Deploy Radar with automatic ticker index
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: radar-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build-data-index.py --site-dir /tmp/radar-site
      - name: Use one Pages deployment source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          echo "::notice title=Pages source::Current build source: $source"
          if [ "$source" != "workflow" ]; then
            if result=$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow 2>&1); then
              echo "::notice title=Pages source::Switched Pages to workflow deployments"
            else
              echo "::warning title=Pages source requires repository settings::$result"
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/radar-site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Install browser verification tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify published Pages URL
        run: python scripts/check-pages.py '${{ steps.deployment.outputs.page_url }}'
