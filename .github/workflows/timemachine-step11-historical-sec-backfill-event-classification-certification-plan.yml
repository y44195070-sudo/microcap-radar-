name: Time Machine STEP11 Historical SEC Backfill Event Classification Certification Plan
on:
  push:
    branches: [main]
    paths:
      - 'timemachine/triggers/step11-historical-sec-backfill-event-classification-certification-plan.txt'
      - '.github/workflows/timemachine-step11-historical-sec-backfill-event-classification-certification-plan.yml'
      - 'timemachine/src/step11_historical_sec_backfill_event_classification_certification_plan.py'
permissions: {contents: read, actions: read}
jobs:
  certify-plan:
    runs-on: ubuntu-latest
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Compile
        run: python -m py_compile timemachine/src/step11_historical_sec_backfill_event_classification_certification_plan.py
      - name: Reacquire frozen authorities
        run: |
          mkdir -p /tmp/frozen
          gh api /repos/${{ github.repository }}/actions/artifacts/12603520492/zip > /tmp/frozen/step9.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12603725128/zip > /tmp/frozen/step9-checkpoint.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12603356621/zip > /tmp/frozen/step10.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12603737037/zip > /tmp/frozen/step10-checkpoint.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12602635150/zip > /tmp/frozen/governance.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12602225859/zip > /tmp/frozen/governance-checkpoint.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12603066455/zip > /tmp/frozen/step9-plan.zip
          gh api /repos/${{ github.repository }}/actions/artifacts/12602074250/zip > /tmp/frozen/step9-plan-checkpoint.zip
      - name: Verify frozen original archive digests
        run: |
          python - <<'PY'
          import hashlib,zipfile
          exp={
          'step9.zip':'3ec6a1f4ec88ff284eade8d7730b301ea65d2d5a932feb11a0f76c0592c7c19c','step9-checkpoint.zip':'a77f89137bfe5c299e46e39864e37826cc03ce84c3cbbede8c681bf538e31238',
          'step10.zip':'b9a5a4d40bfc318288a15337fd74c47dcff93de619d6aa281ea9de6001ebf1de','step10-checkpoint.zip':'914587ecbbe5bcb579aff464b11c8fec0469f7400ee8eddc3d757f9ab30e181f',
          'governance.zip':'5e256090278d2fdbfb76b190d965c64e7e3251ac2e67a061c55b8a76cd7549c4','governance-checkpoint.zip':'b6543ba219317b0beac67a683fea9ec4b6711a2677ed0c16467133ed2b94da64',
          'step9-plan.zip':'d6c4e4703a8614907631345f6312933da06bd2c55e9f09a008759d606a51cd50','step9-plan-checkpoint.zip':'fbc1852d688859f41d543853ac45e798a8df89f378949bcb82f2f0caeaccf65e'}
          for n,h in exp.items():
            p='/tmp/frozen/'+n; got=hashlib.sha256(open(p,'rb').read()).hexdigest(); assert got==h,(n,got,h); assert zipfile.ZipFile(p).testzip() is None
          PY
      - name: Verify frozen decisions and STEP10 boundary
        run: |
          python - <<'PY'
          import json,zipfile
          def read(z,n): return json.loads(zipfile.ZipFile(z).read(n))
          s9=read('/tmp/frozen/step9.zip','final_certification_decision.json'); assert s9.get('decision')=='STEP9_LIMITED_COVERAGE_CERTIFIED'
          s10=read('/tmp/frozen/step10.zip','step10_decision.json'); assert s10['decision']=='STEP10_CERTIFIED_ONLY_CONSUMPTION_GUARD_CERTIFIED'
          b=read('/tmp/frozen/step10.zip','occurrence_boundary_verification.json'); assert b['total']==5026 and b['certified']==638 and b['residual']==4388 and b['overlap']==0 and b['missing']==0 and b['duplicates']==0
          g=read('/tmp/frozen/step10.zip','certified_only_guard_contract.json'); assert g['authoritative_occurrence_key']=='forensic_occurrence_id' and g['certified_count']==638 and g['residual_count']==4388
          PY
      - name: Execute Plan Pass A
        run: python timemachine/src/step11_historical_sec_backfill_event_classification_certification_plan.py --out /tmp/step11-plan-a --head-sha '${{ github.sha }}'
      - name: Execute Plan Pass B
        run: python timemachine/src/step11_historical_sec_backfill_event_classification_certification_plan.py --out /tmp/step11-plan-b --head-sha '${{ github.sha }}'
      - name: Determinism and strict plan validation
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          A=pathlib.Path('/tmp/step11-plan-a'); B=pathlib.Path('/tmp/step11-plan-b')
          assert {p.name for p in A.glob('*.json')}=={p.name for p in B.glob('*.json')}
          for p in A.glob('*.json'): assert hashlib.sha256(p.read_bytes()).hexdigest()==hashlib.sha256((B/p.name).read_bytes()).hexdigest(),p.name
          d=json.load(open(A/'step11_plan_decision.json')); assert d['decision']=='STEP11_HISTORICAL_SEC_BACKFILL_AND_EVENT_CLASSIFICATION_CERTIFICATION_PLAN_GO'
          n=json.load(open(A/'negative_plan_tests.json')); assert n['count']==35 and n['PASS']
          p=json.load(open(A/'positive_plan_tests.json')); assert p['count']==15 and p['PASS']
          s=json.load(open(A/'step11_scope.json')); assert not s['full_backfill_executed'] and not s['residual_identity_recovery'] and not s['v2_integration']
          PY
      - name: Protected diff audit
        run: |
          python - <<'PY'
          import subprocess
          fs=subprocess.check_output(['git','diff','--name-only','d07e4cbae552ffed2391904e76bcbae0a5584397','HEAD'],text=True).splitlines()
          allowed={'.github/workflows/timemachine-step11-historical-sec-backfill-event-classification-certification-plan.yml','timemachine/triggers/step11-historical-sec-backfill-event-classification-certification-plan.txt','timemachine/src/step11_historical_sec_backfill_event_classification_certification_plan.py'}
          assert set(fs)<=allowed,fs
          assert not any(f.startswith('v2/') for f in fs)
          PY
      - name: Security scan
        run: |
          python - <<'PY'
          import pathlib,re
          files=[pathlib.Path('timemachine/src/step11_historical_sec_backfill_event_classification_certification_plan.py'),pathlib.Path('.github/workflows/timemachine-step11-historical-sec-backfill-event-classification-certification-plan.yml')]
          text='\n'.join(p.read_text() for p in files)
          patterns=[r'Authorization:\s*(?!REDACTED)',r'api[_-]?key\s*[=:]\s*["\'][^"\']+',r'[?&](?:apiKey|token|key)=[^&\s]+']
          assert not any(re.search(x,text,re.I) for x in patterns)
          PY
      - name: Build checkpoint
        run: cp /tmp/step11-plan-a/checkpoint.json /tmp/step11-plan-checkpoint.json
      - name: Upload STEP11 Plan Checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: step11-historical-sec-backfill-event-classification-certification-plan-checkpoint
          path: /tmp/step11-plan-checkpoint.json
      - name: Upload STEP11 Plan Certification
        uses: actions/upload-artifact@v4
        with:
          name: step11-historical-sec-backfill-event-classification-certification-plan
          path: /tmp/step11-plan-a/*.json
      - name: Independently reacquire and verify uploaded artifacts
        run: |
          sleep 3
          python - <<'PY'
          import json,subprocess,zipfile,hashlib,os
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['GITHUB_RUN_ID']
          data=json.loads(subprocess.check_output(['gh','api',f'/repos/{repo}/actions/runs/{run}/artifacts'],text=True))['artifacts']
          assert len(data)==2,data
          names={a['name']:a for a in data}; expected={'step11-historical-sec-backfill-event-classification-certification-plan','step11-historical-sec-backfill-event-classification-certification-plan-checkpoint'}; assert set(names)==expected
          for name,a in names.items():
            p='/tmp/reacquired-'+name+'.zip'; open(p,'wb').write(subprocess.check_output(['gh','api',f"/repos/{repo}/actions/artifacts/{a['id']}/zip"])); got=hashlib.sha256(open(p,'rb').read()).hexdigest(); assert a.get('digest') in (None,'sha256:'+got); assert zipfile.ZipFile(p).testzip() is None
          z=zipfile.ZipFile('/tmp/reacquired-step11-historical-sec-backfill-event-classification-certification-plan.zip'); m=json.loads(z.read('manifest.json')); assert len({e['path'] for e in m['entries']})==len(m['entries'])
          for e in m['entries']: assert hashlib.sha256(z.read(e['path'])).hexdigest()==e['sha256']
          d=json.loads(z.read('step11_plan_decision.json')); assert d['decision']=='STEP11_HISTORICAL_SEC_BACKFILL_AND_EVENT_CLASSIFICATION_CERTIFICATION_PLAN_GO'
          PY
