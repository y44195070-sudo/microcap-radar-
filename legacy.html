<style>
/* Layout: single-column terminal feed — sticky search, ticker sheet of stacked panels, numbers in mono */
:root{
  color-scheme:dark;
  --bg:#070b16; --panel:#0e1527; --panel2:#141e36; --line:#1f2b4a;
  --tx:#eef2fb; --mut:#8e9cc0; --dim:#5f6d92;

  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:10px 48px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px 10px;z-index:5;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.brand b{font-family:var(--mono);font-size:17px;letter-spacing:.06em}
.brand span{color:var(--mut);font-size:12px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:500 18px var(--mono);padding:11px 14px;text-transform:uppercase}
.search input::placeholder{text-transform:none;font-family:var(--sans);color:var(--dim);font-size:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:var(--b);color:#04101f;font-weight:700;padding:11px 16px}
button.ghost{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:10px}
.chip{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:5px 13px;font:700 14px var(--mono)}
main{display:grid;gap:12px;padding-top:12px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.sec>h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-wrap:balance}
.sec>h3 small{color:var(--dim);font-weight:500;font-size:12px}
.sec.r{border-left:4px solid var(--r)}.sec.y{border-left:4px solid var(--y)}.sec.g{border-left:4px solid var(--g)}.sec.p{border-left:4px solid var(--p)}.sec.b{border-left:4px solid var(--b)}
.hero{background:linear-gradient(165deg,#12204a,#0a1124 70%);border:1px solid var(--line);border-radius:18px;padding:16px}
.hero .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero h1{margin:0;font:700 36px/1 var(--mono);letter-spacing:.02em}
.hero .co{color:var(--mut);font-size:14px;margin-top:6px}
.hero .px{margin-top:10px;font:700 22px var(--mono)}
.hero .px small{display:block;font:400 12px var(--sans);color:var(--dim)}
.fresh{margin-top:8px;font-size:12px;color:var(--mut)}
.score{flex:none;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;text-align:center;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--line) 0);position:relative}
.score::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#0b1430}
.score div{position:relative;font:700 26px/1 var(--mono)}

.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;border:1px solid transparent}
.pill.r{color:var(--r);background:var(--rbg);border-color:rgba(255,93,110,.35)}
.pill.y{color:var(--y);background:var(--ybg);border-color:rgba(255,207,74,.35)}

.lbl{font-weight:700;margin-top:10px;font-size:14px}.lbl.r{color:var(--r)}.lbl.y{color:var(--y)}.lbl.p{color:var(--p)}.lbl.g{color:var(--g)}

.tiles small{font-size:11px;color:var(--dim)}
.callout{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.callout.y{background:var(--ybg);border:1px solid rgba(255,207,74,.3)}
.callout.b{background:var(--bbg);border:1px solid rgba(90,168,255,.3)}
.callout.p{background:rgba(180,140,255,.10);border:1px solid rgba(180,140,255,.35)}.callout.r{background:rgba(255,99,99,.10);border:1px solid rgba(255,99,99,.35)}.callout.g{background:rgba(80,220,140,.10);border:1px solid rgba(80,220,140,.35)}
.callout h4{margin:0 0 4px;font-size:12px;color:var(--mut);font-weight:700}

.ev{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;border-top:1px solid var(--line);padding-block:9px}
.ev:first-child{border-top:0}

.dd.far{background:var(--bbg);color:var(--b)}.dd.past{background:var(--panel2);color:var(--dim)}
.hrow{border-top:1px solid var(--line);padding-block:9px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.hrow:first-child{border-top:0}
.hrow b{font-size:14px}.hrow .pc{font:700 14px var(--mono);text-align:right}
.hrow .m{grid-column:1/-1;font-size:12px;color:var(--mut)}
.tl{display:grid;grid-template-columns:auto auto 1fr;gap:6px 10px;align-items:baseline;font-size:13px}
.tl .k{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;text-align:center}
.frame{margin:8px 0}.frame b{display:block;font-size:14px}

details.fold{margin-top:12px}details.fold summary small{color:var(--mut,#8a94a8);font-weight:400;margin-left:6px;font-size:.85em}details{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px}

.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.star{background:none;border:1px solid var(--line);border-radius:10px;color:var(--y);font-size:20px;line-height:1;padding:6px 9px;cursor:pointer}.star.on{background:rgba(255,200,60,.12);border-color:rgba(255,200,60,.5)}.sec h3 .star{font-size:16px;padding:3px 7px;margin-left:auto}.rab{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.goal{border-top:1px solid var(--line);padding-block:10px}.goal:first-child{border-top:0}.goal.main{background:var(--bbg);border-radius:10px;padding:10px;border-top:0;margin-bottom:6px}.goal .gh{display:flex;justify-content:space-between;gap:8px;align-items:center}.goal .gp{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;margin-top:4px;font-weight:700}.goal .gp .up{color:var(--g)}.goal .gp .dn{color:var(--r)}.goal .gk{font-size:13px;margin-top:4px}.goal .gkl{font-style:normal;display:inline-block;min-width:46px;color:var(--mut);font-size:12px}.hrow .pc small.up{color:var(--g)}.hrow .pc small.dn{color:var(--r)}
.arch-why{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.arch-why button{flex:1 1 45%;padding:9px 6px;font-size:13px;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:10px}
.tabs button[aria-current="page"]{background:var(--bbg);color:var(--b);border-color:rgba(90,168,255,.45)}
.sorts{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sorts button{flex:none;padding:7px 12px;font-size:13px;border-radius:999px;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.sorts button[aria-pressed="true"]{background:var(--ybg);color:var(--y);border-color:rgba(255,207,74,.45)}
.rk{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center;border-top:1px solid var(--line);padding-block:12px;cursor:pointer}
.rk:first-of-type{border-top:0}
.rk .n{font:700 22px var(--mono);text-align:center}

.rk .mv.up{color:var(--g)}.rk .mv.dn{color:var(--r)}.rk .mv.nw{color:var(--b)}

.cand{border-top:1px solid var(--line);padding-block:12px;display:grid;gap:6px}

.c-r{color:var(--r)}.c-y{color:var(--y)}.c-g{color:var(--g)}.gauge{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.gauge i{display:block;height:100%}

.fd{font-size:14px;background:var(--panel2);border-radius:10px;padding:8px 10px;margin-top:6px}.fd .dn{color:var(--r);font-family:var(--mono)}.fdbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px;gap:1px}.fdbar i{display:block;min-width:2px}.fdlg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--mut);margin-top:4px}.fdlg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.nx{font-size:14px;margin-top:8px}.kp{display:grid;gap:4px;margin-top:8px}.kp>div{font-size:13px;display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:baseline}.kp small{color:var(--mut);font-size:12px;min-width:0}.kp .up{color:var(--g)}.kp .dn{color:var(--r)}ul.fl{font-size:13px;margin-top:2px}
details.grp{padding:12px 14px}details.grp>summary{font-size:15px}details.grp>summary small{color:var(--mut);font-weight:400;font-size:12px;margin-left:4px}.gin{display:grid;gap:12px;margin-top:12px}.gin details{background:var(--panel2)}
.gh2{font-size:15px;margin:6px 0 0}.gh2 small{color:var(--mut);font-weight:400;font-size:12px}.wl{display:grid;margin-top:8px}.wrow{display:grid;grid-template-columns:56px auto auto auto;gap:4px 8px;align-items:center;border-top:1px solid var(--line);padding:9px 0;cursor:pointer}.wrow:first-child{border-top:0}.wrow small{grid-column:1/-1}

<script>

 "WSHP": {

  conclusion:[ "문장" | {t:"F|E|S", x:"문장"} ],           // 10초 결론

      const frag=document.createDocumentFragment();let last=0,m;
      while((m=TERM_RE.exec(txt))){
        const st=m.index+m[1].length,term=m[2];
        frag.append(txt.slice(last,st));
        const sp=document.createElement('span');sp.className='tm';sp.textContent=term;sp.dataset.k=term;sp.tabIndex=0;
        const g=document.createElement('span');g.className='gl';
        const [pr,mean]=TERMS[term];
        const short=node.parentElement.closest('.pill');const full=!(short||seen.has(term));if(!short)seen.add(term);
        g.innerHTML=full?`(<span class="pr">${esc(pr)}</span><span class="sep"> · </span><span class="mn">${esc(mean)}</span>)`:`(<span class="pr">${esc(pr)}</span>)`;if(!full)g.classList.add('pronly');
        frag.append(sp,g);last=st+term.length;
      }
      frag.append(txt.slice(last));node.replaceWith(frag);
    });
  });
}

function ladder(d){
  if(!d.priceMap)return'';
  const cur=d.priceNum;
  const rows=d.priceMap.map(x=>({p:parseFloat(String(x[0]).replace(/[^0-9.]/g,'')),lab:x[0],t:x[1]})).filter(r=>!isNaN(r.p));
  if(cur&&!rows.some(r=>Math.abs(r.p-cur)<1e-6))rows.push({p:cur,lab:'$'+cur,t:'기준가 '+(d.refDate||''),cur:true});
  rows.forEach(r=>{if(cur&&Math.abs(r.p-cur)<1e-6)r.cur=true});
  rows.sort((a,b)=>b.p-a.p);
  return sec('🪜 가격 사다리',`<div class="ladder">${rows.map(r=>{const v=cur?pct(r.p,cur):null;
    return `<div class="rung ${r.cur?'cur':''}"><span class="p">${esc(r.lab)}</span><span class="d ${v>0?'up':v<0?'dn':''}">${r.cur?'지금':v!==null?sgn(v):''}</span><span class="t">${esc(r.t)}</span></div>`}).join('')}</div>

/* ---- 김곰 툴 참고 기능: 목적별 필요 주가 · 선례 · 평단 · 패턴 · 기대 공시 · 런웨이 · 분석률 · 마감 ---- */
function bestPump(d){const P=(d.pumps||[]).filter(x=>Number(x.pct)>0);return P.length?{max:Math.max(...P.map(x=>+x.pct)),n:P.length}:null}
function goalVerdict(d,g){const cur=d.priceNum;
  if(g.px===null||g.px===undefined)return{c:'off',t:'가격 무관',need:null};
  if(!cur)return{c:'off',t:'기준가 없음',need:null};
  const need=pct(g.px,cur);if(need<=0)return{c:'g',t:'이미 위',need};
  const b=bestPump(d);if(!b)return{c:'off',t:'자체 선례 없음',need};
  if(need<=b.max)return{c:'g',t:'선례 도달',need};
  if(need<=b.max*1.5)return{c:'y',t:'선례 근접',need};
  return{c:'r',t:'선례 밖',need};}

function costsSec(d){const C=d.costs;if(!C||!C.length)return'';const cur=d.priceNum;

function awaitsSec(d){const A=d.awaits||[],R=d.arrived||[];if(!A.length&&!R.length)return'';

function runwayLine(d){const r=d.runCalc;if(!r||!r.cash)return'';

const CHECK_FIELDS=[['발행주식','structure.os'],['유통주식','structure.float'],['현금','cash.cash'],['월 소진','cash.burn'],['공매도 잔고','short.latestSI'],['빌리는 이자','short.ctb'],['희석 물량','dilution'],['일정','events'],['회사 목적','purpose'],['보유자','holders'],['목적별 필요 주가','goals'],['과거 급등','pumps']];
function completeness(d){const miss=[];CHECK_FIELDS.forEach(([n,path])=>{const v=path.split('.').reduce((o,k)=>o&&o[k],d);

function dueKind(t){return /상폐|상장 유지|\$1 미달|\$1 회복|최소 호가|나스닥.{0,12}(통지|기한|상폐)|회복 기한/.test(t)?['상장','r']:/standstill|공모 금지|락업|144|만료|재판매|EFFECT|효력/.test(t)?['물량 풀림','y']:/전환|리셋|하한|플로어|노트|전환사채/.test(t)?['전환','p']:/병합/.test(t)?['병합','p']:/주총|실적|10-Q|출시|콘퍼런스/.test(t)?['일정','b']:['기타','b']}
function dueItems(){const out=[];const T0=today();
  ACTIVE().forEach(t=>{const d=DB()[t];const seen=new Set();
    const add=(date,title,src)=>{const x=parseD(date);if(x===null)return;const n=Math.round((x-T0)/864e5);if(n<-1||n>60)return;const k=date+title;if(seen.has(k))return;seen.add(k);out.push({t,n,date,title,src})};
    (d.events||[]).forEach(e=>add(e.date,e.title,'일정'));
    (d.goals||[]).forEach(g=>g.by&&add(g.by,g.t+(g.px?` — $${g.px} 필요`:'')+(g.next?' · '+g.next:''),'목적'));
    (d.awaits||[]).forEach(a=>add(a.d,a.form+' '+a.what+' 대기','공시대기'));});
  return out.sort((a,b)=>a.n-b.n||(DB()[b.t].score||0)-(DB()[a.t].score||0))}

  return sec('🔍 닮은 과거 사례',`<p class="note">이 종목 특징: ${esc(fl)}</p>${L.slice(0,3).map(x=>caseRow(x.c,x.s,t)).join('')}<div class="callout b"><h4>가장 닮은 5건은 그 뒤에 어떻게 됐나</h4>${Object.entries(fc).map(([k,v])=>`<span class="pill ${FATE_C[k]||'off'}">${esc(k)} ${v}</span>`).join(' ')}<br>다음 날 평균 <b class="num">${sg(avg)}</b> (${t1s.length}건 기준, 계산)<p class="note" style="margin:4px 0 0">⚠️ 같은 구조인데 안 오른 사례 ${(RADAR_DB.misses||[]).length}건 — 이게 쌓여야 진짜 확률이 돼요.</p></div>`,'b',`사례 ${(RADAR_DB.cases||[]).length}건 중`,'급등이 나왔던 과거 종목 중 유통주식·시총·병합 시점·공급 상태·현금이 비슷한 것을 찾았어요. 비슷하다고 같은 결과가 나온다는 뜻은 아니에요. 사례가 쌓일수록 정확해져요.')}

function grpStat(L){const n=L.length,t=L.filter(c=>c.t1!=null).map(c=>c.t1);const bad=L.filter(c=>c.fate==='붕괴'||c.fate==='공모').length;const of=L.filter(c=>c.offer).length;
  return {n,avg:t.length?Math.round(t.reduce((a,b)=>a+b,0)/t.length):null,tn:t.length,bad:n?Math.round(bad/n*100):null,of:n?Math.round(of/n*100):null}}
function statRow(lab,L){const s=grpStat(L);return `<div class="hrow"><b>${esc(lab)} <span class="note num">${s.n}건</span></b><span class="pc">${sg(s.avg)}<small>다음 날 평균 (${s.tn}건)</small></span><div class="m">무너짐·공모로 끝남 ${s.bad==null?'—':s.bad+'%'} · 4거래일 안 공모 ${s.of==null?'—':s.of+'%'}</div></div>`}
function authorKey(a){a=String(a||'');return /김곰/.test(a)?'김곰':/토끼/.test(a)?'토끼형':/래빗|Rabbit/i.test(a)?'래빗스탁':/사용자|나/.test(a)?'사용자':'기타'}

    `<div style="margin-top:10px">${B.map(([a,b])=>{const J=judged.filter(x=>x.p>=a&&x.p<b),hit=J.filter(x=>x.result.hit).length;const avgP=J.length?Math.round(J.reduce((s,x)=>s+x.p,0)/J.length):null;

    'b','보정표','막대는 실제로 20거래일 안에 장중 +40%가 나온 비율이에요. "예측 20~35%" 칸의 실제 비율이 20~35% 근처면 잘 맞는 거예요. 크게 벗어나면 급등확률 항목 점수를 고쳐야 해요.');
  // 2. 종배

      :`<p class="note">아직 기록 없음. 아침 업데이트가 전날 종배 후보의 다음 날 결과를 여기에 적어요.</p>`,'p',`${cl.length}건 채점`,'종배 탭에서 뽑은 후보가 다음 날 실제로 올랐는지 등급별로 셉니다. ❌ 패스 등급이 더 잘 올랐다면 채점표를 고쳐야 한다는 신호예요.');
  // 2-1. 발굴
  {const LG=((RADAR_DB.discovery||{}).log||[]);const J=LG.filter(x=>x.r20!=null);const BK=[[55,70,'🟡 관찰 55~69'],[70,101,'🟢 유력 70+'],[0,55,'⚪ 미달']];

  // 3. 공시 예측
  const AR=[];Object.entries(DB()).forEach(([t,d])=>(d.arrived||[]).forEach(a=>AR.push(Object.assign({t},a))));

  const waitN=Object.values(DB()).reduce((s,d)=>s+(d.awaits||[]).length,0);

  // 4. 외부 의견 성적표
  const AU={};const ALL=RADAR_DB.tickers;Object.entries(ALL).forEach(([t,d])=>(d.opinions||[]).forEach(o=>{const k=authorKey(o.author);const A=AU[k]=AU[k]||{ok:0,no:0,q:0,n:0,res:[]};A.n++;(o.checks||[]).forEach(c=>{A[c[1]in A?c[1]:'q']++;if(/결과/.test(c[2]))A.res.push([t,c[1],c[0],c[2]])})}));

  $('#view').innerHTML=h;annotate($('#view'));bindHelp();
}

/* ---- 📊 복기 탭: 매일 아침 급등락 복기 (RADAR_DB.reviews) ---- */
function revIcon(x){return /급등 사례/.test(x)?'🚀':/되돌림|급락/.test(x)?'📉':/원인 불명/.test(x)?'❓':/T\+1/.test(x)?'🔁':/교훈/.test(x)?'💡':/감시/.test(x)?'👀':/장후/.test(x)?'🌙':'📌'}
function revCls(x){return /급등 사례/.test(x)?'g':/되돌림|급락/.test(x)?'r':/원인 불명/.test(x)?'y':/교훈/.test(x)?'b':/감시/.test(x)?'p':''}
function revLink(s){return esc(s).replace(/핵심:/g,'<b>핵심:</b>').replace(/\b([A-Z]{2,5})\b/g,(m,t)=>DB()[t]?`<b class="tkl noterm" data-t="${t}" role="link" tabindex="0">${t}</b>`:m)}
function revRows(L){return L.map(x=>`<div class="rv">${revLink(x)}</div>`).join('')}
function revTop(r){const s=(r.secs||[]).find(x=>/급등 사례/.test(x.h));if(!s)return[];
  return s.items.slice(0,6).map(x=>{const m=x.match(/^\d+\.\s*([A-Z]{2,5})\b/);if(!m)return null;const q=x.slice(0,140).match(/[+−-]\d+(?:\.\d+)?%/);return [m[1],q?q[0]:'']}).filter(Boolean)}
function revFind(t){const out=[];const re=new RegExp('\\b'+t.replace(/[^A-Z0-9]/g,'')+'\\b');
  (RADAR_DB.reviews||[]).forEach(r=>(r.secs||[]).forEach(s=>s.items.forEach(x=>{if(re.test(x))out.push({date:r.date,h:s.h,x})})));
  return out.sort((a,b)=>b.date.localeCompare(a.date))}
let revSel=null,revQ='';
function reviewView(){
  const R=[...(RADAR_DB.reviews||[])].sort((a,b)=>b.date.localeCompare(a.date));

  <div class="search" style="margin-bottom:10px"><input id="rq" placeholder="티커로 찾기 (예: WFF)" value="${esc(revQ)}" autocapitalize="characters" autocomplete="off" aria-label="복기 티커 찾기"><button id="rgo">찾기</button></div>
  <div class="sorts" role="group" aria-label="날짜">${R.map(r=>`<button data-rd="${esc(r.date)}" aria-pressed="${!revQ&&r.date===revSel}">${esc(r.date.slice(5).replace('-','/'))}</button>`).join('')}</div></section>`;
  if(revQ){const F=revFind(revQ);
    h+=sec(`🔎 ${esc(revQ)} 복기 기록`,F.length?F.map(x=>`<div class="rv"><span class="pill b num">${esc(x.date)}</span> <span class="pill ${revCls(x.h)||'off'}">${revIcon(x.h)} ${esc(x.h)}</span><br>${revLink(x.x)}</div>`).join(''):`<p class="note">복기 기록에 ${esc(revQ)}가 없어요.</p>`,'b',F.length+'건')+`<button class="ghost" id="rclr">← 날짜별 보기</button>`;

  }

  h+=`<details><summary>📚 패턴 사전 (급등 ${P.up.length} · 급락 ${P.down.length})</summary><div class="lbl g">🚀 핵심 급등 패턴</div>${pat(P.up)}<div class="lbl r">📉 급락·되돌림 패턴</div>${pat(P.down)}</details>`;
  h+=`<p class="note">원본: 프로젝트 문서 claude/급등락복기_누적.md · 매일 아침(한국 시간) 자동 추가. 확인 못 한 값은 "확인 필요"로 남겨요.</p>`;
  $('#view').innerHTML=h;annotate($('#view'));bindHelp();

  <p><b>점수 100</b> 공급 막힘 25 · 유통 압축 20 (100만↓20, 300만↓16, 500만↓12, 1,000만↓6) · 날짜 있는 재료 15 (30일 안 확정 15, 60일 안 8) · 대차 압박 15 · 현금 여유 15 (12개월↑15, 6~12개월 9, 3~6개월 4, 3개월 미만 0) · 거래 점화 10 · <b>감점</b> 나스닥 즉시 상폐 조건(2년 누적 병합 250:1 이상, 1년 안 병합 후 다시 $1 미만 등) −10, 이미 유통의 20배 넘게 회전 −5</p>
  <p><b>왜 이렇게?</b> 사례 도서관 44건을 보면 공급이 열린 급등은 45%가 4거래일 안 공모로 끝났고, 유통 100만 주 미만 급등은 다음 날 평균 −61%였어요. 그래서 "오를 수 있나"보다 "오른 뒤 회사가 바로 팔 수 있나"에 가장 큰 점수를 줘요.</p>
  <p><b>주식 수 대조</b> 제3자 사이트의 발행주식 수는 최신 8-K·10-Q와 꼭 맞춰 봐요. 10/14 TRUG는 제3자 21만 주 vs 공시 약 150만 주로 크게 틀렸어요.</p>
  <p><b>등급</b> 70점↑ 🟢 유력 · 55~69 🟡 관찰 · 55 미만은 목록에서 빼고 "점수 미달 관찰"로 · 최대 5개 · 매일 아침 업데이트</p>
  <p><b>채점</b> 발굴 당일 종가 기준으로 5·20거래일 안 장중 최고가를 기록해 적중(+40%)을 셉니다. 점수 구간별로 실제 적중률이 다르게 나와야 기준이 맞는 거예요.</p></details>`;
  h+=`<p class="note">발굴 후보의 숫자는 제3자 데이터라 정식 분석에서 바뀔 수 있어요. 매수 추천이 아니에요.</p>`;
  $('#view').innerHTML=h;annotate($('#view'));bindHelp();
  document.querySelectorAll('[data-req]').forEach(b=>b.onclick=e=>{e.stopPropagation();copy(b.dataset.req+' 분석해줘','요청 문구 복사됨 · Claude 대화에 붙여넣으세요')});
}

const GRADE={fire:['🔥 종배 최우선','r'],ok:['✅ 종배 가능','g'],cond:['⚠️ 조건부','y'],pass:['❌ 패스','off']};
const CPARTS=[['volume','거래량 점화·유지',20],['flow','체결강도·종가 수급',20],['drop','하락 과대',15],['dilution','오늘 밤 희석 차단',20],['short','공매·대차 구조',10],['float','유통량 구조',10],['risk','악재 위험도(높을수록 안전)',5]];
function nextScan(){const n=new Date();const k=new Date(n.getTime()+(n.getTimezoneOffset()+540)*6e4);
  for(let i=0;i<8;i++){const d=new Date(k);d.setDate(k.getDate()+i);d.setHours(4,20,0,0);const wd=d.getDay();if(wd>=2&&wd<=6&&d>k)return `${d.getMonth()+1}/${d.getDate()}(${'일월화수목금토'[wd]}) 오전 4:20`}return'화~토 오전 4:20'}
function closeView(){
  const C=RADAR_DB.closing||{candidates:[]};

  h+=`<section class="sec"><h3>🌙 종배 치트키<small>${C.runAt?esc(C.runAt):'아직 스캔 전'}</small></h3>

  <div class="kv"><div><span>다음 자동 스캔 (한국 시간)</span><b>${nextScan()}</b></div><div><span>기준</span><b>${C.session?esc(C.session):'미국 정규장 마감 전'}</b></div></div>
  ${C.basis?`<p class="note">${esc(C.basis)}</p>`:''}${C.note?`<div class="callout y">${esc(C.note)}</div>`:''}</section>`;
  const L=C.candidates||[];
  if(!L.length){h+=sec('아직 스캔 결과가 없어요',`<div class="empty"><p>매주 화~토 오전 4시 20분(미국 장 마감 전)에 자동으로 하락률 상위 종목을 훑고, 결과를 알림으로 보내고 이곳에 채워요.</p><p class="note">지금 바로 보고 싶으면 Claude 대화에서 "종배 스캔해줘"라고 보내세요.</p></div>`)}
  else h+=`<section class="sec"><h3>오늘의 후보<small>점수 높은 순</small></h3>${[...L].sort((a,b)=>(b.score||0)-(a.score||0)).map(c=>{const g=GRADE[c.grade]||GRADE.pass;const P=c.parts||{},F=c.facts||{};
    return `<div class="cand"><div class="hd"><b class="noterm">${esc(c.ticker)} <span style="color:var(--r);font-size:15px">${esc(c.drop||'')}</span></b><span class="num" style="font-weight:700;font-size:18px">${V(c.score)}<small class="note">/100</small></span></div>
    <div class="note">${esc(c.company||'')}</div>
    <div class="pills" style="margin:0"><span class="pill ${g[1]}">${g[0]}</span>${c.dilutionVerdict?`<span class="pill ${c.dilutionVerdict==='공급 막힘'?'g':c.dilutionVerdict==='공급 열림'?'r':'y'}">${esc(c.dilutionVerdict)}</span>`:''}${c.shortVerdict?`<span class="pill ${c.shortVerdict==='공매 오링'?'g':c.shortVerdict==='공매 여유 많음'?'r':'y'}">${esc(c.shortVerdict)}</span>`:''}${c.flowKnown?'':'<span class="pill off">체결강도 확인 불가</span>'}</div>
    <p style="margin:2px 0;font-weight:700">${esc(c.oneLine||'')}</p>${c.easy?`<p class="help" style="margin:0">💡 ${esc(c.easy)}</p>`:''}
    ${c.reason?`<p class="note">하락 원인: ${esc(c.reason)}</p>`:''}${c.risk?`<div class="callout y" style="margin-top:0">⚠️ ${esc(c.risk)}</div>`:''}
    <details style="padding:8px 12px"><summary>점수 내역 · 근거</summary><div class="bars" style="margin-top:8px">${CPARTS.map(([k,lab,mx])=>{const v=P[k];const known=v!==null&&v!==undefined;return `<div class="bar1"><span>${lab}</span><div class="tr"><div class="fl" style="width:${known?v/mx*100:0}%;background:${known&&v/mx>=.6?'var(--g)':known&&v/mx>=.35?'var(--y)':'var(--r)'}"></div></div><span class="num">${known?v:'?'}/${mx}</span></div>`}).join('')}</div>
    ${kv([['거래량 (전일 대비 유지)',F.vol],['체결강도',F.flow],[L2('ATM'),F.atm],[L2('ELOC'),F.eloc],['셸프 · 등록 효력',[F.shelf,F.effect].filter(Boolean).join(' · ')],[L2('Resale','재판매'),F.resale],['워런트',F.warrant],['전환증권',F.conv],[L2('Short Interest','공매도 잔고'),F.si],[L2('Short Float','유통 대비 공매도'),F.shortFloat],[L2('CTB','빌리는 이자'),F.ctb],['빌릴 수 있는 주식',F.avail],[L2('Reg SHO'),F.regsho],['발행·유통 주식',[F.os,F.float].filter(Boolean).join(' / ')]])}</details></div>`}).join('')}</section>`;
  if(C.history&&C.history.length)h+=`<details><summary>지난 스캔 기록 (${C.history.length})</summary>${C.history.map(x=>`<p><b class="num">${esc(x.date)}</b> ${x.picks.map(p=>`${esc(p[0])} ${(GRADE[p[1]]||GRADE.pass)[0].split(' ')[0]}`).join(' · ')}</p>`).join('')}</details>`;
  h+=`<details><summary>채점 기준 보기 (100점)</summary>
  <p><b>거래량 점화·유지 20</b> 당일 거래량 ÷ 유통주식(회전), 전일 대비 거래 유지율, 평소 대비 배수. 전날 급등주는 '오늘도 거래가 붙어 있는지'가 핵심이에요. 전일의 5% 미만으로 말랐으면 낮게.</p>
  <p><b>체결강도·종가 수급 20</b> 체결강도 100%↑면 가점, 장중 저점에서 반등 중이면 가점, 저점 근처에 붙어 있거나 시가·VWAP 한참 아래면 감점. 확인 못 하면 "확인 불가"로 두고 나머지 80점을 100점으로 환산해요.</p>
  <p><b>하락 과대 15</b> 하락률 최상위일수록, 단순 투매일수록 높게.</p>
  <p><b>오늘 밤 희석 차단 20</b> 지금 바로 나올 수 있는 물량(효력 난 재판매, 0원·즉시 행사 워런트, 진행 중인 직접공모, 변동가 전환사채)은 크게 감점. 회사 재량으로 써야 하는 ELOC·셸프는 작게 감점.</p>
  <p><b>공매·대차 10</b> 빌릴 주식 거의 0, CTB 높음, Reg SHO면 높게.</p>
  <p><b>유통량 10</b> 1,000만·500만·100만 주 이하로 갈수록 가점.</p>
  <p><b>악재 위험도 5</b> 파산·상장폐지·FDA 실패·사기 의혹이 있으면 0에 가깝게.</p>
  <p><b>등급</b> 85↑ 🔥 최우선 · 70~84 ✅ 가능 · 55~69 ⚠️ 조건부 · 55 미만 ❌ 패스. 체결강도를 확인 못 하면 🔥는 주지 않아요. 거래가 전일의 5% 미만으로 말랐으면 최대 ⚠️ 조건부.</p>
  <p class="note">2026-10-14 개정: WFF(10/13 장) 사례 이후 거래량·체결강도 비중을 40점으로 올렸어요. 한 사례에서 나온 기준이라 계속 검증 중이에요.</p></details>`;
  h+=`<div class="callout y"><h4>종배 전에 다시 보기 (내 단타 원칙)</h4>추격 매수 금지 · 풀매수 금지 · 손실 복구매매 금지 · 매수 전 이유·손절가·익절가 먼저 적기</div>`;
  h+=`<p class="note">토끼형의 "10~30% 반등" 경험칙은 통계적 확률이 아니에요. 이 탭은 구조 점검 도구이고 매수 추천이 아니에요.</p>`;
  $('#view').innerHTML=h;annotate($('#view'));bindHelp();
}
const L2=(en,ko)=>`${ko?ko+' ':''}<i class="noterm">${esc(en)}${TERMS[en]?'<span class="pr">('+TERMS[en][0]+')</span>':''}</i>`;

function setTab(k){document.querySelectorAll('#tabs [data-tab]').forEach(b=>{if(b.dataset.tab===k)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}

function nav(t){
  t=(t||'').trim().toUpperCase();
  window.scrollTo(0,0);
  if(t==='@RANK'||t==='RANK'){try{history.replaceState(null,'','#rank')}catch(e){}$('#q').value='';setTab('rank');return rankView()}
  if(t==='@CLOSE'||t==='CLOSE'){try{history.replaceState(null,'','#close')}catch(e){}$('#q').value='';setTab('close');return closeView()}
  if(t==='@FAV'||t==='FAV'){try{history.replaceState(null,'','#fav')}catch(e){}$('#q').value='';setTab('fav');return favView()}
  if(t==='@RABBIT'||t==='RABBIT'){try{history.replaceState(null,'','#rabbit')}catch(e){}$('#q').value='';setTab('rabbit');return rabbitView()}
  if(t==='@LAB'||t==='LAB'){try{history.replaceState(null,'','#lab')}catch(e){}$('#q').value='';setTab('lab');return labView()}
  if(t==='@PIGGY'||t==='PIGGY'){try{history.replaceState(null,'','#piggy')}catch(e){}$('#q').value='';setTab('piggy');return piggyView()}
  if(t==='@DUE'||t==='DUE'){try{history.replaceState(null,'','#due')}catch(e){}$('#q').value='';setTab('due');return dueView()}
  if(t==='@ARCH'||t==='ARCH'){try{history.replaceState(null,'','#arch')}catch(e){}$('#q').value='';setTab('arch');return archView()}
  if(t==='@REVIEW'||t==='REVIEW'){try{history.replaceState(null,'','#review')}catch(e){}$('#q').value='';setTab('review');return reviewView()}
  if(t==='@FIND'||t==='FIND'){try{history.replaceState(null,'','#find')}catch(e){}$('#q').value='';setTab('find');return findView()}
  try{history.replaceState(null,'',t?'?ticker='+encodeURIComponent(t):location.pathname)}catch(e){}
  $('#q').value=t;setTab('list');
  if(!t)return home();
  DB()[t]?show(t):unknown(t);
}

$('#go').onclick=()=>nav($('#q').value);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('tkl'))nav(e.target.dataset.t)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')nav($('#q').value)});
document.addEventListener('click',e=>{const ar=e.target.closest('[data-arch],[data-unarch]');if(ar){e.preventDefault();const t=ar.dataset.arch||ar.dataset.unarch;setArch(t,ar.dataset.arch?ar.dataset.why:null);chipsBar();show(t);return}const fv=e.target.closest('[data-fav]');if(fv){e.preventDefault();e.stopPropagation();toggleFav(fv.dataset.fav);const on=isFav(fv.dataset.fav);document.querySelectorAll('[data-fav="'+fv.dataset.fav+'"]').forEach(b=>{b.classList.toggle('on',on);b.textContent=on?'★':'☆';b.setAttribute('aria-pressed',on)});const cur=document.querySelector('#tabs [aria-current]');if(cur&&cur.dataset.tab==='fav')favView();return}const tb=e.target.closest('[data-tab]');if(tb){nav(tb.dataset.tab==='list'?'':'@'+tb.dataset.tab);return}const el=e.target.closest('[data-t]');if(el)nav(el.dataset.t)});
hydrateRadarSnapshot();
chipsBar();
let init='';try{init=new URLSearchParams(location.search).get('ticker')||''}catch(e){}
if(!init){try{init=(location.hash||'').slice(1)}catch(e){}}
nav(init);
/* External analyses are adapted to the existing Radar model, leaving rendering intact. */
function radarAnalysis(raw, ticker){
  if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('Invalid analysis');
  if(raw.ticker&&raw.ticker!==ticker)throw new Error('Ticker/filename mismatch');
  const d={...raw};
  const signal=raw.signal||{},memo=raw.memo||{},verified=raw.verified||{};
  d.signal={...signal,c:signal.c||({red:'r',yellow:'y',green:'g'}[signal.color])||'y',t:signal.t||signal.text||'확인 필요',why:signal.why||raw.supply?.items||[]};
  d.conclusion=raw.conclusion||[signal.summary,memo.structure].filter(Boolean);
  d.structure={reverseSplit:verified.reverseSplit,...raw.structure};
  d.supply={...raw.supply,immediate:raw.supply?.immediate||raw.supply?.items||[]};
  d.events=(raw.events||[]).map(e=>({...e,title:e.title||e.event||''}));
  d.scenarios=raw.scenarios||raw.scenario;
  d.frames=raw.frames||raw.framework;
  d.memo={...memo,supply:memo.supply||memo.dilution,next:memo.next||memo.watch};
  d.risks=raw.risks||[memo.risk].filter(Boolean);
  d.analyzedAt=raw.analyzedAt||raw.asOf;
  if(raw.correctionToPost&&!raw.thesis)d.thesis={title:'게시글 해석 검증',old:[],now:raw.correctionToPost,verdict:signal.summary||''};
  if(Object.keys(verified).length&&!raw.timeline)d.timeline=Object.entries(verified).map(([k,t])=>({d:raw.asOf||'',k:'공시',t}));
  if(raw.sources?.length&&!raw.opinions)d.opinions=[{author:'분석 출처',points:raw.sources}];
  if(d.rubric)d.score=RUB.reduce((a,[k])=>a+(Number(d.rubric[k])||0),0);
  return d;
}
function hydrateRadarSnapshot(){
  try{
    const snapshot=JSON.parse(document.getElementById('radar-external-data')?.textContent||'{}');
    Object.entries(snapshot).forEach(([ticker,raw])=>{
      try{if(/^[A-Z][A-Z0-9.-]*$/.test(ticker))DB()[ticker]={...(DB()[ticker]||{}),...radarAnalysis(raw,ticker)}}
      catch(e){console.warn('Radar snapshot entry skipped:',ticker,e)}
    });
  }catch(e){console.warn('Radar snapshot unavailable:',e)}
}
async function loadRadarAnalyses(){
  const valid=name=>/^[A-Z][A-Z0-9.-]*\.json$/.test(name);
  const dataBase=new URL('./data/',location.href);
  const get=async path=>{
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
    try{const r=await fetch(new URL(path,dataBase),{cache:'no-store',signal:controller.signal});if(!r.ok)throw new Error(`${path}: ${r.status}`);return r}
    finally{clearTimeout(timer)}
  };
  let files=[];
  try{
    // Local HTTP servers expose directory listings; Pages uses the build manifest.
    if(['localhost','127.0.0.1'].includes(location.hostname)){
      try{const html=await (await get('./')).text();const doc=new DOMParser().parseFromString(html,'text/html');files=[...doc.querySelectorAll('a[href]')].map(a=>a.getAttribute('href')).filter(valid)}catch(e){console.warn('Radar directory discovery:',e)}
    }
    if(!files.length){files=await (await get('index.json')).json();if(!Array.isArray(files))throw new Error('Invalid ticker manifest');files=files.filter(name=>typeof name==='string'&&valid(name))}
    await Promise.all([...new Set(files)].map(async name=>{
      try{const ticker=name.slice(0,-5),raw=await (await get(encodeURIComponent(name))).json();const adapted=radarAnalysis(raw,ticker);DB()[ticker]={...(DB()[ticker]||{}),...adapted}}
      catch(e){console.warn('Radar analysis skipped:',name,e)}
    }));
    chipsBar();
    // Preserve navigation changes made while requests were in flight.
    const ticker=new URLSearchParams(location.search).get('ticker');
    nav(ticker||(location.hash||'').slice(1));
  }catch(e){console.warn('Radar external data unavailable; embedded analyses retained:',e)}
}
loadRadarAnalyses();
</script>
